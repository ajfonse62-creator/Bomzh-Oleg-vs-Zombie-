<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>Зомби Апокалипсис против бомжа Олега и кольца 3</title>
<style>
  body { margin: 0; background: #111; color: #0f0; font-family: monospace; overflow: hidden; }
  canvas { display: block; width: 100vw; height: calc(100vh - 50px); image-rendering: pixelated; }
  #msg { position: absolute; top: 8px; left: 8px; background: #300; border: 2px solid #f00; color: #fff; padding: 6px 10px; font-size: 14px; }
  #hud { height: 50px; background: #222; border-top: 2px solid #777; display: flex; justify-content: space-around; align-items: center; font-size: 18px; color: #f44; font-weight: bold; }
  #hud span { color: #fff; }
</style>
</head>
<body>
<div id="msg">Загрузка...</div>
<canvas id="c" width="320" height="200"></canvas>
<div id="hud"><div>HP: <span id="hp">100</span></div><div>ОРДА: <span id="en">0</span></div><div>ЭТАП: <span id="st">1</span>/3</div></div>

<script>
const c = document.getElementById('c'), ctx = c.getContext('2d'), sp = {}, keys = {};
['oleg','zombie','friend','gun','soldier'].forEach((n, i) => {
  const f = document.createElement('canvas'); f.width = f.height = 32;
  f.getContext('2d').fillStyle = ['#f80','#2a2','#0af','#888','#562'][i]; f.getContext('2d').fillRect(8, 4, 16, 28);
  sp[n] = { im: f, ok: 0 };
  const m = new Image(); m.onload = () => sp[n] = { im: m, ok: 1 }; m.src = n + '.png';
});

function snd(f1, f2) {
  try {
    const a = new (window.AudioContext || window.webkitAudioContext)(), o = a.createOscillator(), g = a.createGain();
    o.type = 'sawtooth'; o.frequency.setValueAtTime(f1, a.currentTime); o.frequency.exponentialRampToValueAtTime(f2, a.currentTime + 0.15);
    g.gain.setValueAtTime(0.15, a.currentTime); g.gain.exponentialRampToValueAtTime(0.01, a.currentTime + 0.15);
    o.connect(g); g.connect(a.destination); o.start(); o.stop(a.currentTime + 0.15);
  } catch (e) {}
}

// 1 = стена здания, 2 = окно здания, 3 = Лаборатория Незнайки, 0 = дорога/улица
const map = [
  "111111111111111111113331",
  "100001000000000000000001",
  "100002000112110001110001",
  "100002000100010001010001",
  "100001000111110000000001",
  "100000000000000000000001",
  "100001000000000000000001",
  "100001000111110001110001",
  "100001000100010001010001",
  "100001000112110000000001",
  "100001000000000000000001",
  "111111111111111111111111"
].map(r => r.split('').map(Number));

let p = { x: 8.5, y: 5.5, dir: 0, hp: 100, dash: 0 }, st = 1, ens = [], rec = 0, run = 1;

function setSt(s) {
  st = s; document.getElementById('st').innerText = st; ens = [];
  if (st === 1) {
    document.getElementById('msg').innerText = "ЭТАП 1: ОРДА ЗОМБИ НА УЛИЦЕ! Отбивайся вместе с Умным Другом!";
    p.x = 8.5; p.y = 5.5; p.dir = 0;
    ens.push({ x: 7.5, y: 5.0, hp: 999, t: 'friend' });
    // Большая орда зомби на дороге
    [[12,5],[13,6],[14,5],[15,6],[13,1],[16,1],[15,10],[18,5],[19,6],[20,5]].forEach(([x,y]) => ens.push({ x, y, hp: 45, t: 'zombie' }));
  } else if (st === 2) {
    document.getElementById('msg').innerText = "ЭТАП 2: Солдаты заражены! Отступай в здание (слева) и стреляй через ОКНА!";
    p.x = 3.0; p.y = 3.0; p.dir = 0;
    ens.push({ x: 2.2, y: 4.0, hp: 999, t: 'friend' });
    [[8.5,2.5],[9.5,3.5],[8.5,6.0],[11.5,5.5],[13.5,6.0]].forEach(([x,y]) => ens.push({ x, y, hp: 60, t: 'soldier' }));
  } else {
    document.getElementById('msg').innerText = "ЭТАП 3: Прорывайся сквозь орду к вывеске 'ЛАБОРАТОРИЯ НЕЗНАЙКИ'!";
    [[14,5],[15,6],[16,4],[17,5],[18,3],[19,4],[20,2]].forEach(([x,y]) => ens.push({ x, y, hp: 50, t: 'zombie' }));
    ens.push({ x: 21.5, y: 1.5, hp: 999, t: 'oleg' });
  }
}

function shoot() {
  if (!run || rec > 0) return; rec = 9; snd(400, 40);
  ens.forEach(e => {
    if (e.t === 'friend' || e.t === 'oleg' || e.hp <= 0) return;
    let d = Math.hypot(e.x - p.x, e.y - p.y), a = Math.atan2(e.y - p.y, e.x - p.x) - p.dir;
    while (a < -Math.PI) a += 6.283; while (a > Math.PI) a -= 6.283;
    if (Math.abs(a) < 0.3 && d < 16) { e.hp -= 35; snd(180, 40); }
  });
}

onkeydown = e => { keys[e.code] = 1; if (e.code === 'Space') shoot(); if (e.code.includes('Shift') && p.dash <= 0) { p.dash = 12; snd(140, 500); } };
onkeyup = e => keys[e.code] = 0;
c.onmousedown = () => { if (c.requestPointerLock && document.pointerLockElement !== c) try { c.requestPointerLock(); } catch(e){} shoot(); };
onmousemove = e => { if (document.pointerLockElement === c) p.dir += e.movementX * 0.003; };

function loop() {
  if (!run) return;
  let spd = p.dash > 0 ? 0.16 : 0.07; if (p.dash > 0) p.dash--; if (rec > 0) rec--;
  if (keys.KeyQ || keys.ArrowLeft) p.dir -= 0.045; if (keys.KeyE || keys.ArrowRight) p.dir += 0.045;
  let mx = 0, my = 0;
  if (keys.KeyW || keys.ArrowUp) { mx += Math.cos(p.dir) * spd; my += Math.sin(p.dir) * spd; }
  if (keys.KeyS || keys.ArrowDown) { mx -= Math.cos(p.dir) * spd; my -= Math.sin(p.dir) * spd; }
  if (keys.KeyA) { mx += Math.sin(p.dir) * spd; my -= Math.cos(p.dir) * spd; }
  if (keys.KeyD) { mx -= Math.sin(p.dir) * spd; my += Math.cos(p.dir) * spd; }
  if (map[Math.floor(p.y)][Math.floor(p.x + mx)] === 0) p.x += mx;
  if (map[Math.floor(p.y + my)][Math.floor(p.x)] === 0) p.y += my;

  let cnt = 0;
  ens.forEach(e => {
    if (e.hp <= 0 || e.t === 'oleg') return;
    let d = Math.hypot(p.x - e.x, p.y - e.y);
    if (e.t === 'friend') {
      if (d > 2.2) { let nx = e.x + (p.x - e.x) / d * 0.045, ny = e.y + (p.y - e.y) / d * 0.045; if (map[Math.floor(ny)][Math.floor(nx)] === 0) { e.x = nx; e.y = ny; } }
      let t = ens.find(x => (x.t === 'zombie' || x.t === 'soldier') && x.hp > 0 && Math.hypot(x.x - e.x, x.y - e.y) < 8);
      if (t && Math.random() < 0.05) t.hp -= 15;
      return;
    }
    cnt++;
    if (d > 1.2) {
      let nx = e.x + (p.x - e.x) / d * 0.02, ny = e.y + (p.y - e.y) / d * 0.02;
      if (map[Math.floor(ny)][Math.floor(nx)] === 0) { e.x = nx; e.y = ny; }
    } else p.hp -= 0.22;
  });

  document.getElementById('hp').innerText = Math.max(0, Math.floor(p.hp));
  document.getElementById('en').innerText = cnt;
  if (p.hp <= 0) { run = 0; alert("ОРДА ПОБЕДИЛА! Попробуй снова."); location.reload(); }
  if (st === 1 && cnt === 0) setSt(2);
  if (st === 2 && cnt === 0) setSt(3);
  if (st === 3 && p.x > 19.5 && p.y < 2.8) { run = 0; snd(520, 800); alert("ПОБЕДА! Умный Друг сварил зелье в Лаборатории Незнайки и вылечил Бомжа Олега, солдат и всю орду!"); location.reload(); }

  // Небо, асфальт дороги и белая разметка
  ctx.fillStyle = '#1b0812'; ctx.fillRect(0, 0, 320, 100);
  ctx.fillStyle = '#38383d'; ctx.fillRect(0, 100, 320, 100);
  ctx.fillStyle = '#fff';
  for (let y = 110; y < 200; y += 22) ctx.fillRect(156, y, 8, 10);

  const zb = [];
  for (let i = 0; i < 80; i++) {
    let ra = p.dir - 0.52 + (i / 80) * 1.04, d = 0, hit = 0;
    while (!hit && d < 24) { d += 0.06; let tx = Math.floor(p.x + Math.cos(ra) * d), ty = Math.floor(p.y + Math.sin(ra) * d); hit = (!map[ty] || map[ty][tx] === undefined) ? 1 : map[ty][tx]; }
    d *= Math.cos(ra - p.dir); zb[i] = d;
    let wh = Math.min(280, 200 / d), sh = Math.max(40, 230 - d * 10);
    if (hit === 1) {
      ctx.fillStyle = `rgb(${sh * 0.7},${sh * 0.45},${sh * 0.4})`; ctx.fillRect(i * 4, 100 - wh / 2, 4, wh);
      if (i % 4 === 0) { ctx.fillStyle = '#ff9'; ctx.fillRect(i * 4 + 1, 100 - wh * 0.25, 2, wh * 0.12); ctx.fillRect(i * 4 + 1, 100 + wh * 0.1, 2, wh * 0.12); }
    } else if (hit === 2) {
      ctx.fillStyle = `rgb(${sh * 0.7},${sh * 0.45},${sh * 0.4})`; ctx.fillRect(i * 4, 100 - wh / 2, 4, wh * 0.3); ctx.fillRect(i * 4, 100 + wh * 0.2, 4, wh * 0.3);
    } else if (hit === 3) {
      ctx.fillStyle = '#04d'; ctx.fillRect(i * 4, 100 - wh / 2, 4, wh);
      if (i % 10 === 0) { ctx.fillStyle = '#ff0'; ctx.font = '8px monospace'; ctx.fillText('ЛАБОРАТОРИЯ НЕЗНАЙКИ', i * 4 - 25, 100); }
    }
  }

  ens.sort((a, b) => Math.hypot(b.x - p.x, b.y - p.y) - Math.hypot(a.x - p.x, a.y - p.y)).forEach(e => {
    if (e.hp <= 0) return;
    let d = Math.hypot(e.x - p.x, e.y - p.y), a = Math.atan2(e.y - p.y, e.x - p.x) - p.dir;
    while (a < -Math.PI) a += 6.283; while (a > Math.PI) a -= 6.283;
    if (Math.abs(a) < 0.7 && d > 0.3) {
      let sx = (0.5 * (a / 0.52) + 0.5) * 320, sz = Math.min(200, 200 / d), ri = Math.floor(sx / 4);
      if (ri >= 0 && ri < 80 && zb[ri] > d) { ctx.save(); if (sp[e.t].ok) ctx.globalCompositeOperation = 'multiply'; ctx.drawImage(sp[e.t].im, sx - sz / 2, 105 - sz / 2, sz, sz); ctx.restore(); }
    }
  });

  ctx.save(); if (sp.gun.ok) ctx.globalCompositeOperation = 'multiply';
  ctx.drawImage(sp.gun.im, 110, 110 + rec * 2, 100, 100); ctx.restore();
  requestAnimationFrame(loop);
}
setSt(1); loop();
</script>
</body>
</html>
