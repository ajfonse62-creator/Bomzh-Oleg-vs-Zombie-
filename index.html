<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <title>Зомби Апокалипсис против бомжа Олега и кольца 3</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div id="mission">ЗАДАНИЕ: Загрузка...</div>
  <div id="crosshair">+</div>
  <canvas id="game"></canvas>

  <div id="hud">
    <div>HP: <span id="hp">100</span>%</div>
    <div>ОРУЖИЕ: <span>ТРУБА-ДРОБОВИК</span></div>
    <div>ВРАГИ: <span id="enemiesLeft">0</span></div>
    <div>ЭТАП: <span id="stageNum">1</span>/3</div>
  </div>

  <div id="overlay">
    <h1>ЗОМБИ АПОКАЛИПСИС<br>ПРОТИВ БОМЖА ОЛЕГА И КОЛЬЦА 3</h1>
    <p>WASD / Стрелки — бежать | Мышь или Q/E — смотреть | ЛКМ / Пробел — стрелять | SHIFT — рывок (ULTRAKILL)</p>
    <button id="startBtn">НАЧАТЬ ИГРУ</button>
  </div>

  <script src="assets.js"></script>
  <script src="engine.js"></script>
</body>
</html>
