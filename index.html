<!DOCTYPE html><html lang="ru"><head><meta charset="UTF-8"><title>Зомби Апокалипсис 3</title><style>
body{margin:0;background:#111;color:#0f0;font:14px monospace;overflow:hidden}
canvas{display:block;width:100vw;height:calc(100vh - 40px);image-rendering:pixelated}
#m{position:absolute;top:6px;left:6px;background:#300;border:2px solid #f00;color:#fff;padding:4px 8px;max-width:90vw}
#h{height:40px;background:#222;border-top:2px solid #777;display:flex;justify-content:space-around;align-items:center;font-size:18px;color:#f44;font-weight:700}
#w{display:none;position:fixed;inset:0;background:#000;color:#fff;flex-direction:column;justify-content:center;align-items:center;text-align:center;z-index:9}
</style></head><body><div id="m"></div><canvas id="c" width="320" height="200"></canvas>
<div id="h"><div>HP:<span id="hp">100</span></div><div>ОРДА:<span id="en">0</span></div><div>ЭТАП:<span id="st">1</span>/3</div></div>
<div id="w"><h1>ВЫ ПРОШЛИ ЭТУ ИГРУ</h1><p>Вы сами нашли «Лабораторию Незнайки» в огромном городе! Умный Друг сварил зелье и вылечил Бомжа Олега, солдат и всю орду!</p><button onclick="location.reload()">ЗАНОВО</button></div>
<script>
const c=document.getElementById('c'),x=c.getContext('2d'),sp={},k={};

// Рисуем детализированных пиксельных персонажей, если .png не загружены
function makeArt(n){
  const f=document.createElement('canvas');f.width=f.height=32;const g=f.getContext('2d');
  if(n=='zombie'){g.fillStyle='#4a2';g.fillRect(10,3,12,10);g.fillStyle='#f00';g.fillRect(12,6,2,2);g.fillRect(18,6,2,2);g.fillStyle='#246';g.fillRect(8,13,16,12);g.fillStyle='#4a2';g.fillRect(4,13,4,10);g.fillRect(24,13,4,10);g.fillStyle='#223';g.fillRect(10,25,5,7);g.fillRect(17,25,5,7)}
  else if(n=='soldier'){g.fillStyle='#352';g.fillRect(9,2,14,5);g.fillStyle='#dca';g.fillRect(10,7,12,6);g.fillStyle='#f00';g.fillRect(12,9,2,2);g.fillRect(18,9,2,2);g.fillStyle='#463';g.fillRect(8,13,16,12);g.fillStyle='#111';g.fillRect(6,16,20,3);g.fillStyle='#231';g.fillRect(10,25,5,7);g.fillRect(17,25,5,7)}
  else if(n=='friend'){g.fillStyle='#642';g.fillRect(10,2,12,4);g.fillStyle='#fdb';g.fillRect(10,6,12,7);g.fillStyle='#000';g.fillRect(11,8,4,3);g.fillRect(17,8,4,3);g.fillStyle='#fff';g.fillRect(8,13,16,12);g.fillStyle='#08f';g.fillRect(15,13,2,10);g.fillStyle='#225';g.fillRect(10,25,5,7);g.fillRect(17,25,5,7)}
  else if(n=='oleg'){g.fillStyle='#555';g.fillRect(9,2,14,5);g.fillStyle='#dca';g.fillRect(10,7,12,6);g.fillStyle='#642';g.fillRect(10,10,12,5);g.fillStyle='#753';g.fillRect(7,13,18,13);g.fillStyle='#333';g.fillRect(10,26,5,6);g.fillRect(17,26,5,6)}
  else{g.fillStyle='#444';g.fillRect(13,6,6,22);g.fillStyle='#222';g.fillRect(14,4,4,4);g.fillStyle='#742';g.fillRect(12,24,8,8)}
  return f;
}
['oleg','zombie','friend','gun','soldier'].forEach(n=>{
  sp[n]={im:makeArt(n),ok:0};const m=new Image();m.onload=()=>sp[n]={im:m,ok:1};m.src=n+'.png';
});

// Генерация ОГРОМНОГО города 60x40 (в 7 раз больше!)
const W=60,H=40,map=Array.from({length:H},(_,y)=>Array.from({length:W},(_,xx)=>{
  if(y==0||y==H-1||xx==0||xx==W-1)return 1;
  if(xx>=48&&xx<=57&&y>=30&&y<=37){ // Здание Лаборатории Незнайки в глубине города
    if(y==30&&(xx==52||xx==53))return 0; // Вход в лабораторию
    if(y==30)return 3; // Синяя стена с вывеской
    if(y==37||xx==48||xx==57)return 6;
    return 0;
  }
  if(xx>=2&&xx<=8&&y>=2&&y<=8){ // Убежище с окнами для 2 этапа
    if(xx==8&&(y==4||y==5))return 2; // Окна
    if(y==8&&xx==5)return 0; // Вход в убежище
    if(xx==2||xx==8||y==2||y==8)return 1;
    return 0;
  }
  // Городские кварталы с разными зданиями (1=красные, 4=жёлтые, 5=серые)
  if(xx%8>=2&&xx%8<=6&&y%8>=2&&y%8<=6){
    if((xx+y)%9==0)return 2; // Окна в домах
    return [1,4,5][(Math.floor(xx/8)+Math.floor(y/8))%3];
  }
  return 0;
}));

let p={x:12.5,y:12.5,d:0,hp:100,sh:0},st=1,ens=[],bs=[],rc=0,run=1,br=0;
function spawnCity(n,hp,t,cd=0){
  for(let i=0;i<n;i++){
    let rx,ry;do{rx=10+Math.floor(Math.random()*46);ry=6+Math.floor(Math.random()*30)}while(map[ry][rx]!=0||Math.hypot(rx-p.x,ry-p.y)<6);
    ens.push({x:rx+.5,y:ry+.5,hp,t,cd});
  }
}
function set(s){st=s;document.getElementById('st').innerText=st;ens=[];bs=[];
if(s==1){document.getElementById('m').innerText="ЭТАП 1: Огромный город захвачен! Зачисти улицы с Умным Другом (WASD, Q/E, ЛКМ/Пробел, SHIFT)";p.x=12.5;p.y=12.5;ens.push({x:11.5,y:12,hp:999,t:'friend'});spawnCity(24,70,'zombie')}
else if(s==2){document.getElementById('m').innerText="ЭТАП 2: Заражённая армия в городе! Отбей атаку солдат (можешь зайти в убежище с окнами на северо-западе)!";ens.push({x:p.x-1,y:p.y,hp:999,t:'friend'});spawnCity(14,95,'soldier',40)}
else{document.getElementById('m').innerText="ЭТАП 3: Исследуй огромный город и САМ НАЙДИ синюю 'ЛАБОРАТОРИЮ НЕЗНАЙКИ'!";ens.push({x:p.x-1,y:p.y,hp:999,t:'friend'});spawnCity(22,80,'zombie');ens.push({x:53,y:34,hp:999,t:'oleg'})}}

function fire(){if(!run||rc>0||br>0)return;rc=7;bs.push({x:p.x+Math.cos(p.d)*.4,y:p.y+Math.sin(p.d)*.4,vx:Math.cos(p.d)*.28,vy:Math.sin(p.d)*.28,fp:1})}
onkeydown=e=>{k[e.code]=1;if(e.code=='Space')fire();if(e.code.includes('Shift')&&p.sh<=0)p.sh=12};onkeyup=e=>k[e.code]=0;
c.onmousedown=()=>{if(c.requestPointerLock&&document.pointerLockElement!==c)try{c.requestPointerLock()}catch(e){}fire()};
onmousemove=e=>{if(document.pointerLockElement===c)p.d+=e.movementX*.003};

function loop(){if(!run)return;let sp0=p.sh>0?.19:.08;if(p.sh>0)p.sh--;if(rc>0)rc--;
if(k.KeyQ||k.ArrowLeft)p.d-=.045;if(k.KeyE||k.ArrowRight)p.d+=.045;
let mx=0,my=0;if(k.KeyW||k.ArrowUp){mx+=Math.cos(p.d)*sp0;my+=Math.sin(p.d)*sp0}if(k.KeyS||k.ArrowDown){mx-=Math.cos(p.d)*sp0;my-=Math.sin(p.d)*sp0}
if(k.KeyA){mx+=Math.sin(p.d)*sp0;my-=Math.cos(p.d)*sp0}if(k.KeyD){mx-=Math.sin(p.d)*sp0;my+=Math.cos(p.d)*sp0}
if(map[p.y|0][(p.x+mx)|0]==0)p.x+=mx;if(map[(p.y+my)|0][p.x|0]==0)p.y+=my;

let cnt=0;ens.forEach(e=>{if(e.hp<=0||e.t=='oleg')return;let d=Math.hypot(p.x-e.x,p.y-e.y);
if(e.t=='friend'){if(br>0){e.x+=(52-e.x)*.05;e.y+=(34-e.y)*.05;return}if(d>2.2){let nx=e.x+(p.x-e.x)/d*.065,ny=e.y+(p.y-e.y)/d*.065;if(map[ny|0][nx|0]==0){e.x=nx;e.y=ny}}
let t=ens.find(z=>(z.t=='zombie'||z.t=='soldier')&&z.hp>0&&Math.hypot(z.x-e.x,z.y-e.y)<10);if(t&&Math.random()<.05){let a=Math.atan2(t.y-e.y,t.x-e.x);bs.push({x:e.x,y:e.y,vx:Math.cos(a)*.28,vy:Math.sin(a)*.28,fp:1})}return}
cnt++;if(d<18){if(d>(e.t=='soldier'?4.5:1.1)){let nx=e.x+(p.x-e.x)/d*.03,ny=e.y+(p.y-e.y)/d*.03;if(map[ny|0][nx|0]==0){e.x=nx;e.y=ny}}else if(e.t=='zombie')p.hp-=.5;
if(e.t=='soldier'&&--e.cd<=0&&d<13){e.cd=60;let a=Math.atan2(p.y-e.y,p.x-e.x);bs.push({x:e.x,y:e.y,vx:Math.cos(a)*.2,vy:Math.sin(a)*.2,fp:0})}}});

bs.forEach(b=>{b.x+=b.vx;b.y+=b.vy;let cl=map[b.y|0]&&map[b.y|0][b.x|0];if(cl==1||cl==3||cl==4||cl==5||cl==6){b.dead=1;return}
if(b.fp)ens.forEach(e=>{if((e.t=='zombie'||e.t=='soldier')&&e.hp>0&&Math.hypot(e.x-b.x,e.y-b.y)<.65){e.hp-=35;b.dead=1}});
else if(Math.hypot(p.x-b.x,p.y-b.y)<.55&&p.sh<=0){p.hp-=16;b.dead=1}});bs=bs.filter(b=>!b.dead);

document.getElementById('hp').innerText=Math.max(0,p.hp|0);document.getElementById('en').innerText=cnt;
if(p.hp<=0){run=0;alert("ОРДА ПОБЕДИЛА!");location.reload()}if(st==1&&cnt==0)set(2);if(st==2&&cnt==0)set(3);
if(st==3&&p.x>48.5&&p.x<56.5&&p.y>30.5&&p.y<36.5){document.getElementById('m').innerText="ВЫ НАШЛИ ЛАБОРАТОРИЮ! Умный Друг варит зелье...";if(++br>110){run=0;document.getElementById('w').style.display='flex';return}}

x.fillStyle='#1b0812';x.fillRect(0,0,320,100);x.fillStyle='#38383d';x.fillRect(0,100,320,100);x.fillStyle='#fff';for(let y=110;y<200;y+=22)x.fillRect(156,y,8,10);
const zb=[];for(let i=0;i<80;i++){let ra=p.d-.52+(i/80)*1.04,d=0,h=0;while(!h&&d<26){d+=.07;let tx=(p.x+Math.cos(ra)*d)|0,ty=(p.y+Math.sin(ra)*d)|0;h=(!map[ty]||map[ty][tx]===undefined)?1:map[ty][tx]}
d*=Math.cos(ra-p.d);zb[i]=d;let wh=Math.min(280,200/d),sh=Math.max(40,240-d*9);
if(h==1){x.fillStyle=`rgb(${sh*.8},${sh*.25},${sh*.2})`;x.fillRect(i*4,100-wh/2,4,wh)}
else if(h==2){x.fillStyle=`rgb(${sh*.75},${sh*.35},${sh*.3})`;x.fillRect(i*4,100-wh/2,4,wh*.3);x.fillRect(i*4,100+wh*.2,4,wh*.3)}
else if(h==3||h==6){x.fillStyle=h==3?`rgb(0,${sh*.45},${sh})`:`rgb(${sh*.2},${sh*.3},${sh*.9})`;x.fillRect(i*4,100-wh/2,4,wh);if(h==3&&i%10==0){x.fillStyle='#ff0';x.font='8px monospace';x.fillText('ЛАБОРАТОРИЯ НЕЗНАЙКИ',i*4-28,100)}}
else if(h==4){x.fillStyle=`rgb(${sh*.9},${sh*.8},${sh*.4})`;x.fillRect(i*4,100-wh/2,4,wh)}
else if(h==5){x.fillStyle=`rgb(${sh*.5},${sh*.55},${sh*.6})`;x.fillRect(i*4,100-wh/2,4,wh)}}

ens.sort((a,b)=>Math.hypot(b.x-p.x,b.y-p.y)-Math.hypot(a.x-p.x,a.y-p.y)).forEach(e=>{if(e.hp<=0)return;let d=Math.hypot(e.x-p.x,e.y-p.y),a=Math.atan2(e.y-p.y,e.x-p.x)-p.d;while(a<-Math.PI)a+=6.283;while(a>Math.PI)a-=6.283;
if(Math.abs(a)<.7&&d>.3&&d<24){let sx=(.5*(a/.52)+.5)*320,sz=Math.min(200,200/d),ri=(sx/4)|0;if(ri>=0&&ri<80&&zb[ri]>d){x.save();if(sp[e.t].ok)x.globalCompositeOperation='multiply';x.drawImage(sp[e.t].im,sx-sz/2,105-sz/2,sz,sz);x.restore();if(e.t=='friend'&&br>0){x.fillStyle='#0f0';x.beginPath();x.arc(sx,105,Math.max(4,18/d),0,6.28);x.fill()}}}});

bs.forEach(b=>{let d=Math.hypot(b.x-p.x,b.y-p.y),a=Math.atan2(b.y-p.y,b.x-p.x)-p.d;while(a<-Math.PI)a+=6.283;while(a>Math.PI)a-=6.283;
if(Math.abs(a)<.7&&d>.15){let sx=(.5*(a/.52)+.5)*320,ri=(sx/4)|0;if(ri>=0&&ri<80&&zb[ri]>d){if(b.fp){let bw=Math.max(5,16/d),bh=Math.min(180,145/d);x.fillStyle='#000';x.fillRect(sx-bw/2-1,105-bh/2-1,bw+2,bh+2);x.fillStyle='#f60';x.fillRect(sx-bw/2,105-bh/2,bw,bh);x.fillStyle='#fe0';x.fillRect(sx-bw/4,105-bh/2+2,bw/2,bh-4)}else{x.fillStyle='#f00';x.beginPath();x.arc(sx,105,Math.max(3,10/d),0,6.28);x.fill()}}}});

x.save();if(sp.gun.ok)x.globalCompositeOperation='multiply';x.drawImage(sp.gun.im,110,110+rc*2,100,100);x.restore();requestAnimationFrame(loop)}
set(1);loop();</script></body></html>
