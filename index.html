<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <title>Зомби Апокалипсис против бомжа Олега и кольца 3</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { background: #1a0505; color: #0f0; font-family: 'Courier New', monospace; overflow: hidden; user-select: none; }
    canvas { display: block; width: 100vw; height: calc(100vh - 80px); image-rendering: pixelated; background: #222; }
    #mission {
      position: absolute; top: 12px; left: 12px;
      background: rgba(20, 0, 0, 0.85); padding: 10px 16px;
      border: 3px solid #f00; color: #fff; font-size: 16px; max-width: 680px; z-index: 10;
    }
    #crosshair {
      position: absolute; top: calc(50% - 40px); left: 50%;
      transform: translate(-50%, -50%); color: #0f0; font-size: 28px; font-weight: bold;
      pointer-events: none; text-shadow: 0 0 4px #000; z-index: 10;
    }
    #hud {
      position: fixed; bottom: 0; width: 100%; height: 80px;
      background: linear-gradient(180deg, #333, #111); border-top: 4px solid #777;
      display: flex; justify-content: space-around; align-items: center;
      font-size: 22px; font-weight: bold; color: #ff3333; z-index: 10;
    }
    #hud span { color: #fff; }
    #end-screen {
      display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0,0,0,0.92); flex-direction: column; justify-content: center;
      align-items: center; color: #fff; text-align: center; z-index: 100; padding: 20px;
    }
    #debug-box {
      position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
      color: #ffff00; background: rgba(0,0,0,0.8); padding: 15px; font-size: 18px;
      z-index: 50; display: none; border: 2px solid #ff0;
    }
    button {
      padding: 15px 35px; font-size: 22px; background: #b00; color: #fff;
      border: 4px solid #fff; cursor: pointer; font-family: inherit; font-weight: bold; margin-top: 20px;
    }
  </style>
</head>
<body>

  <div id="mission">ЭТАП 1: Отстреливайся от зомби вместе с Умным Другом! (WASD — идти, Q/E — поворот, ЛКМ/Пробел — огонь, SHIFT — рывок)</div>
  <div id="crosshair">+</div>
  <div id="debug-box"></div>
  <canvas id="game"></canvas>

  <div id="hud">
    <div>HP: <span id="hp">100</span>%</div>
    <div>ОРУЖИЕ: <span>ТРУБА-ДРОБОВИК</span></div>
    <div>ВРАГИ: <span id="enemiesLeft">0</span></div>
    <div>ЭТАП: <span id="stageNum">1</span>/3</div>
  </div>

  <div id="end-screen"></div>

<script>
window.onerror = function(msg, url, line) {
  const box = document.getElementById('debug-box');
  box.style.display = 'block';
  box.innerText = 'Ошибка в строке ' + line + ': ' + msg;
};

const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
canvas.width = 480;
canvas.height = 300;

let audioCtx = null;
let musicStarted = false;

function play8Bit(type) {
  try {
    if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    if (audioCtx.state === 'suspended') audioCtx.resume();
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.connect(gain);
    gain.connect(audioCtx.destination);
    const now = audioCtx.currentTime;

    if (type === 'shoot') {
      osc.type = 'sawtooth';
      osc.frequency.setValueAtTime(420, now);
      osc.frequency.exponentialRampToValueAtTime(40, now + 0.16);
      gain.gain.setValueAtTime(0.3, now);
      gain.gain.exponentialRampToValueAtTime(0.01, now + 0.16);
      osc.start(now); osc.stop(now + 0.16);
    } else if (type === 'hit') {
      osc.type = 'square';
      osc.frequency.setValueAtTime(170, now);
      osc.frequency.exponentialRampToValueAtTime(40, now + 0.15);
      gain.gain.setValueAtTime(0.28, now);
      gain.gain.linearRampToValueAtTime(0.01, now + 0.15);
      osc.start(now); osc.stop(now + 0.15);
    } else if (type === 'dash') {
      osc.type = 'triangle';
      osc.frequency.setValueAtTime(140, now);
      osc.frequency.exponentialRampToValueAtTime(500, now + 0.12);
      gain.gain.setValueAtTime(0.2, now);
      gain.gain.linearRampToValueAtTime(0.01, now + 0.12);
      osc.start(now); osc.stop(now + 0.12);
    } else if (type === 'win') {
      osc.type = 'square';
      const notes = [261.6, 329.6, 392.0, 523.3, 659.3];
      notes.forEach((f, i) => osc.frequency.setValueAtTime(f, now + i * 0.11));
      gain.gain.setValueAtTime(0.25, now);
      gain.gain.linearRampToValueAtTime(0.01, now + 0.65);
      osc.start(now); osc.stop(now + 0.65);
    }
  } catch (e) {}
}

function startMusic() {
  try {
    if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    if (audioCtx.state === 'suspended') audioCtx.resume();
    if (musicStarted) return;
    musicStarted = true;
    const notes = [82.4, 82.4, 164.8, 82.4, 82.4, 146.8, 82.4, 82.4, 130.8, 82.4, 82.4, 116.5, 82.4, 82.4, 123.5, 130.8];
    let step = 0;
    setInterval(() => {
      if (!gameRunning || !audioCtx) return;
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.type = 'sawtooth';
      osc.frequency.setValueAtTime(notes[step % notes.length], audioCtx.currentTime);
      gain.gain.setValueAtTime(0.05, audioCtx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.14);
      osc.connect(gain);
      gain.connect(audioCtx.destination);
      osc.start();
      osc.stop(audioCtx.currentTime + 0.14);
      step++;
    }, 175);
  } catch (e) {}
}

const sprites = {};
function loadSafeSprite(name, src, fallbackColor) {
  const fb = document.createElement('canvas');
  fb.width = 64; fb.height = 64;
  const fbx = fb.getContext('2d');
  fbx.fillStyle = fallbackColor;
  fbx.fillRect(16, 8, 32, 56);
  sprites[name] = { img: fb, isLoaded: false };

  const img = new Image();
  img.onload = () => {
    sprites[name] = { img: img, isLoaded: true };
  };
  img.src = src;
}

loadSafeSprite('oleg', 'oleg.png', '#ff8800');
loadSafeSprite('zombie', 'zombie.png', '#22aa22');
loadSafeSprite('friend', 'friend.png', '#00aaff');
loadSafeSprite('gun', 'gun.png', '#666666');
loadSafeSprite('soldier', 'soldier.png', '#556622');

const signCanvas = document.createElement('canvas');
signCanvas.width = 256; signCanvas.height = 128;
const sx = signCanvas.getContext('2d');
sx.fillStyle = '#0033aa'; sx.fillRect(0, 0, 256, 128);
sx.strokeStyle = '#00ffff'; sx.lineWidth = 8; sx.strokeRect(4, 4, 248, 120);
sx.fillStyle = '#ffff00'; sx.font = 'bold 22px Courier New'; sx.textAlign = 'center';
sx.fillText('ЛАБОРАТОРИЯ', 128, 52);
sx.fillText('НЕЗНАЙКИ', 128, 88);

const mapRows = [
  "11111111111111113331",
  "10000100000000000001",
  "10000200000000000001",
  "10000200000000000001",
  "10000100000000000001",
  "10000000000000000001",
  "10000100000000000001",
  "10000100000000000001",
  "10000100000000000001",
  "11111111111111111111"
];
const levelMap = mapRows.map(r => r.split('').map(Number));

let player = { x: 7.5, y: 5.0, dir: 0, hp: 100, dashTimer: 0, bob: 0 };
let stage = 1;
let enemies = [];
let projectiles = [];
let gunRecoil = 0;
let gameRunning = true;
const keys = {};

function setupStage(s) {
  stage = s;
  document.getElementById('stageNum').innerText = stage;
  enemies = [];
  projectiles = [];

  if (stage === 1) {
    document.getElementById('mission').innerText = "ЭТАП 1: Отстреливайся от зомби вместе с Умным Другом! (WASD — идти, Q/E — поворот, ЛКМ/Пробел — огонь)";
    player.x = 7.5; player.y = 5.0; player.dir = 0;
    enemies.push({ x: 6.8, y: 3.8, hp: 9999, type: 'friend', cd: 0 });
    enemies.push({ x: 11.5, y: 3.5, hp: 50, type: 'zombie' });
    enemies.push({ x: 12.5, y: 6.0, hp: 50, type: 'zombie' });
    enemies.push({ x: 13.5, y: 4.5, hp: 50, type: 'zombie' });
  } else if (stage === 2) {
    document.getElementById('mission').innerText = "ЭТАП 2: Армия солдат заражена! Вы в здании — стреляйте через ОКНА!";
    player.x = 3.0; player.y = 3.0; player.dir = 0;
    enemies.push({ x: 2.5, y: 4.2, hp: 9999, type: 'friend', cd: 0 });
    enemies.push({ x: 8.5, y: 2.2, hp: 75, type: 'soldier', cd: 80 });
    enemies.push({ x: 9.8, y: 4.2, hp: 75, type: 'soldier', cd: 110 });
    enemies.push({ x: 11.0, y: 3.0, hp: 75, type: 'soldier', cd: 95 });
  } else if (stage === 3) {
    document.getElementById('mission').innerText = "ЭТАП 3: Прорывайтесь к синей вывеске 'ЛАБОРАТОРИЯ НЕЗНАЙКИ'!";
    enemies.push({ x: 13.0, y: 3.0, hp: 60, type: 'zombie' });
    enemies.push({ x: 15.0, y: 5.0, hp: 60, type: 'zombie' });
    enemies.push({ x: 17.5, y: 1.8, hp: 9999, type: 'oleg' });
  }
}

window.addEventListener('keydown', e => {
  startMusic();
  keys[e.code] = true;
  if (e.code === 'Space') shoot();
  if ((e.code === 'ShiftLeft' || e.code === 'ShiftRight') && player.dashTimer <= 0 && gameRunning) {
    player.dashTimer = 12;
    play8Bit('dash');
  }
});
window.addEventListener('keyup', e => keys[e.code] = false);

canvas.addEventListener('mousedown', () => {
  startMusic();
  if (gameRunning) {
    if (canvas.requestPointerLock && document.pointerLockElement !== canvas) {
      try { canvas.requestPointerLock(); } catch (e) {}
    }
    shoot();
  }
});

window.addEventListener('mousemove', e => {
  if (document.pointerLockElement === canvas) player.dir += e.movementX * 0.0032;
});

function hasLineOfSight(x1, y1, x2, y2) {
  let dist = Math.hypot(x2 - x1, y2 - y1);
  let steps = Math.floor(dist * 4);
  for (let i = 1; i < steps; i++) {
    let tx = Math.floor(x1 + ((x2 - x1) * i) / steps);
    let ty = Math.floor(y1 + ((y2 - y1) * i) / steps);
    if (levelMap[ty] && levelMap[ty][tx] === 1) return false;
  }
  return true;
}

function shoot() {
  if (!gameRunning || gunRecoil > 0) return;
  gunRecoil = 12;
  play8Bit('shoot');

  let closest = null;
  let minDist = 18;
  enemies.forEach(en => {
    if (en.type === 'friend' || en.type === 'oleg' || en.hp <= 0) return;
    let dx = en.x - player.x;
let dy = en.y - player.y;
let dist = Math.hypot(dx, dy);
let angle = Math.atan2(dy, dx) - player.dir;
while (angle < -Math.PI) angle += Math.PI * 2;
while (angle > Math.PI) angle -= Math.PI * 2;
if (Math.abs(angle) < 0.22 && dist < minDist && hasLineOfSight(player.x, player.y, en.x, en.y)) {
minDist = dist;
closest = en;
}
});
if (closest) {
closest.hp -= 30;
play8Bit('hit');
}
}
function showEnd(title, text, color) {
gameRunning = false;
if (document.exitPointerLock) try { document.exitPointerLock(); } catch (e) {}
const scr = document.getElementById('end-screen');
scr.style.display = 'flex';
scr.innerHTML = <h1 style="color:${color}; font-size:34px; margin-bottom:15px;">${title}</h1> <p style="font-size:20px; max-width:600px;">${text}</p> <button onclick="location.reload()">ИГРАТЬ СНОВА</button>;
}
function update() {
let speed = player.dashTimer > 0 ? 0.16 : 0.065;
if (player.dashTimer > 0) player.dashTimer--;
if (gunRecoil > 0) gunRecoil--;
if (keys['KeyQ'] || keys['ArrowLeft']) player.dir -= 0.045;
if (keys['KeyE'] || keys['ArrowRight']) player.dir += 0.045;
let moveX = 0, moveY = 0;
if (keys['KeyW'] || keys['ArrowUp']) { moveX += Math.cos(player.dir) * speed; moveY += Math.sin(player.dir) * speed; }
if (keys['KeyS'] || keys['ArrowDown']) { moveX -= Math.cos(player.dir) * speed; moveY -= Math.sin(player.dir) * speed; }
if (keys['KeyA']) { moveX += Math.sin(player.dir) * speed; moveY -= Math.cos(player.dir) * speed; }
if (keys['KeyD']) { moveX -= Math.sin(player.dir) * speed; moveY += Math.cos(player.dir) * speed; }
if (moveX !== 0 || moveY !== 0) player.bob += 0.25;
if (levelMap[Math.floor(player.y)][Math.floor(player.x + moveX)] === 0) player.x += moveX;
if (levelMap[Math.floor(player.y + moveY)][Math.floor(player.x)] === 0) player.y += moveY;
let activeEnemies = 0;
enemies.forEach(en => {
if (en.hp <= 0) return;
if (en.type === 'friend') {
let d = Math.hypot(player.x - en.x, player.y - en.y);
if (d > 2.2) {
let nx = en.x + ((player.x - en.x) / d) * 0.045;
let ny = en.y + ((player.y - en.y) / d) * 0.045;
if (levelMap[Math.floor(ny)][Math.floor(nx)] === 0) { en.x = nx; en.y = ny; }
}
if (en.cd > 0) en.cd--;
else {
let target = enemies.find(t => (t.type === 'zombie' || t.type === 'soldier') && t.hp > 0 && Math.hypot(t.x - en.x, t.y - en.y) < 10 && hasLineOfSight(en.x, en.y, t.x, t.y));
if (target) {
en.cd = 55;
let ang = Math.atan2(target.y - en.y, target.x - en.x);
projectiles.push({ x: en.x, y: en.y, vx: Math.cos(ang) * 0.22, vy: Math.sin(ang) * 0.22, fromPlayer: true, color: '#00ffff' });
}
}
return;
}
if (en.type === 'oleg') return;
activeEnemies++;
let dx = player.x - en.x;
let dy = player.y - en.y;
let dist = Math.hypot(dx, dy);
let moveSpeed = en.type === 'zombie' ? 0.02 : 0.012;
if (dist > (en.type === 'soldier' ? 4.5 : 1.1)) {
let nx = en.x + (dx / dist) * moveSpeed;
let ny = en.y + (dy / dist) * moveSpeed;
if (levelMap[Math.floor(ny)][Math.floor(nx)] === 0) { en.x = nx; en.y = ny; }
} else if (en.type === 'zombie') {
player.hp -= 0.3;
}
if (en.type === 'soldier') {
if (en.cd > 0) en.cd--;
else if (dist < 11 && hasLineOfSight(en.x, en.y, player.x, player.y)) {
en.cd = 110;
let ang = Math.atan2(dy, dx);
projectiles.push({ x: en.x, y: en.y, vx: Math.cos(ang) * 0.14, vy: Math.sin(ang) * 0.14, fromPlayer: false, color: '#ff4400' });
}
}
});
projectiles.forEach(p => {
p.x += p.vx;
p.y += p.vy;
let tile = levelMap[Math.floor(p.y)] && levelMap[Math.floor(p.y)][Math.floor(p.x)];
if (tile === 1) { p.dead = true; return; }
if (p.fromPlayer) {
enemies.forEach(en => {
if ((en.type === 'zombie' || en.type === 'soldier') && en.hp > 0 && Math.hypot(en.x - p.x, en.y - p.y) < 0.6) {
en.hp -= 20;
p.dead = true;
if (en.hp <= 0) play8Bit('hit');
}
});
} else {
if (Math.hypot(player.x - p.x, player.y - p.y) < 0.5 && player.dashTimer <= 0) {
player.hp -= 12;
p.dead = true;
}
}
});
projectiles = projectiles.filter(p => !p.dead);
if (player.hp <= 0) {
showEnd("ТЕБЯ ПОБЕДИЛИ!", "Зомби оказались сильнее. Попробуй ещё раз!", "#ff3333");
return;
}
document.getElementById('hp').innerText = Math.max(0, Math.floor(player.hp));
document.getElementById('enemiesLeft').innerText = activeEnemies;
if (stage === 1 && activeEnemies === 0) setupStage(2);
if (stage === 2 && activeEnemies === 0) setupStage(3);
if (stage === 3 && player.x > 16.5 && player.y < 2.8) {
play8Bit('win');
showEnd(
"ВЫ НАШЛИ ЛАБОРАТОРИЮ НЕЗНАЙКИ!",
"Твой Умный Друг зашёл в лабораторию и сварил лечебное зелье! Все зомби, заражённые солдаты и Бомж Олег полностью вылечились!",
"#00ff00"
);
}
}
function render() {
const w = canvas.width;
const h = canvas.height;
const halfH = h / 2;
const fov = Math.PI / 3;
const dirX = Math.cos(player.dir);
const dirY = Math.sin(player.dir);
const planeX = -dirY * Math.tan(fov / 2);
const planeY = dirX * Math.tan(fov / 2);
for (let y = halfH + 1; y < h; y += 2) {
const p = y - halfH;
const rowDist = halfH / p;
const stepX = rowDist * (2 * planeX) / w;
const stepY = rowDist * (2 * planeY) / w;
let floorX = player.x + rowDist * (dirX - planeX);
let floorY = player.y + rowDist * (dirY - planeY);
const shade = Math.max(40, Math.min(180, 190 - rowDist * 14));
for (let x = 0; x < w; x += 4) {
const checker = (Math.floor(floorX) + Math.floor(floorY)) & 1;
ctx.fillStyle = checker ? rgb(${shade}, ${shade * 0.95}, ${shade * 0.95}) : rgb(${shade * 0.7}, ${shade * 0.7}, ${shade * 0.75});
ctx.fillRect(x, y, 4, 2);
ctx.fillStyle = checker ? rgb(${shade * 0.6}, ${shade * 0.3}, ${shade * 0.3}) : rgb(${shade * 0.4}, ${shade * 0.2}, ${shade * 0.25});
ctx.fillRect(x, h - y, 4, 2);
floorX += stepX * 4;
floorY += stepY * 4;
}
}
const numRays = 160;
const rayW = w / numRays;
const zBuffer = new Array(numRays);
for (let i = 0; i < numRays; i++) {
let rayAngle = (player.dir - fov / 2) + (i / numRays) * fov;
let dist = 0;
let hit = 0;
let rx = Math.cos(rayAngle);
let ry = Math.sin(rayAngle);
while (hit === 0 && dist < 24) {
dist += 0.04;
let tx = Math.floor(player.x + rx * dist);
let ty = Math.floor(player.y + ry * dist);
if (tx < 0 || tx >= 20 || ty < 0 || ty >= 10) { hit = 1; break; }
if (levelMap[ty][tx] > 0) hit = levelMap[ty][tx];
}
dist *= Math.cos(rayAngle - player.dir);
zBuffer[i] = dist;
let wallHeight = Math.min(h * 1.5, h / dist);
let shade = Math.max(60, 245 - dist * 10);
if (hit === 1) {
ctx.fillStyle = rgb(${shade}, ${shade * 0.35}, ${shade * 0.35});
ctx.fillRect(i * rayW, (h - wallHeight) / 2, rayW + 0.5, wallHeight);
} else if (hit === 2) {
ctx.fillStyle = rgb(${shade}, ${shade * 0.35}, ${shade * 0.35});
ctx.fillRect(i * rayW, (h - wallHeight) / 2, rayW + 0.5, wallHeight * 0.3);
ctx.fillRect(i * rayW, (h + wallHeight) / 2 - wallHeight * 0.3, rayW + 0.5, wallHeight * 0.3);
ctx.fillStyle = 'rgba(0, 200, 255, 0.25)';
ctx.fillRect(i * rayW, (h - wallHeight * 0.4) / 2, rayW + 0.5, wallHeight * 0.4);
} else if (hit === 3) {
ctx.fillStyle = '#0044dd';
ctx.fillRect(i * rayW, (h - wallHeight) / 2, rayW + 0.5, wallHeight);
if (i % 12 === 0) {
ctx.drawImage(signCanvas, i * rayW - 35, (h - wallHeight * 0.45) / 2, 85, wallHeight * 0.45);
}
}
}
enemies.sort((a, b) => Math.hypot(b.x - player.x, b.y - player.y) - Math.hypot(a.x - player.x, a.y - player.y));
enemies.forEach(en => {
if (en.hp <= 0 || !sprites[en.type]) return;
let dx = en.x - player.x;
let dy = en.y - player.y;
let dist = Math.hypot(dx, dy);
let angle = Math.atan2(dy, dx) - player.dir;
while (angle < -Math.PI) angle += Math.PI * 2;
while (angle > Math.PI) angle -= Math.PI * 2;
if (Math.abs(angle) < fov / 1.3 && dist > 0.3) {
let screenX = (0.5 * (angle / (fov / 2)) + 0.5) * w;
let size = Math.min(h * 1.1, (h / dist) * 1.1);
let rayIdx = Math.floor(screenX / rayW);
if (rayIdx >= 0 && rayIdx < numRays && zBuffer[rayIdx] > dist) {
ctx.save();
if (sprites[en.type].isLoaded) ctx.globalCompositeOperation = 'multiply';
ctx.drawImage(sprites[en.type].img, screenX - size / 2, (h - size) / 2 + 15, size, size);
ctx.restore();
}
}
});
projectiles.forEach(pt => {
let dx = pt.x - player.x;
let dy = pt.y - player.y;
let dist = Math.hypot(dx, dy);
let angle = Math.atan2(dy, dx) - player.dir;
while (angle < -Math.PI) angle += Math.PI * 2;
while (angle > Math.PI) angle -= Math.PI * 2;
if (Math.abs(angle) < fov / 1.4 && dist > 0.2) {
let screenX = (0.5 * (angle / (fov / 2)) + 0.5) * w;
let rayIdx = Math.floor(screenX / rayW);
if (rayIdx >= 0 && rayIdx < numRays && zBuffer[rayIdx] > dist) {
let pSize = Math.max(4, 18 / dist);
ctx.fillStyle = pt.color;
ctx.fillRect(screenX - pSize / 2, halfH, pSize, pSize);
}
}
});
if (sprites.gun) {
let bobX = Math.cos(player.bob) * 6;
let bobY = Math.abs(Math.sin(player.bob)) * 6;
let gw = 140, gh = 140;
ctx.save();
if (sprites.gun.isLoaded) ctx.globalCompositeOperation = 'multiply';
ctx.drawImage(sprites.gun.img, w / 2 - gw / 2 + bobX, h - gh + 15 + bobY + gunRecoil * 3, gw, gh);
ctx.restore();
}
if (gunRecoil > 8) {
ctx.fillStyle = '#ffee00';
ctx.beginPath();
ctx.arc(w / 2, h - 115, 18, 0, Math.PI * 2);
ctx.fill();
}
}
function loop() {
if (!gameRunning) return;
update();
render();
requestAnimationFrame(loop);
}
setupStage(1);
requestAnimationFrame(loop);
