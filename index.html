<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <title>Зомби Апокалипсис против бомжа Олега и кольца 3</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div id="mission">ЗАДАНИЕ: Нажми «НАЧАТЬ ИГРУ»</div>
  <div id="crosshair">+</div>
  <canvas id="game"></canvas>

  <div id="hud">
    <div>HP: <span id="hp">100</span>%</div>
    <div>ОРУЖИЕ: <span>ТРУБА-ДРОБОВИК</span></div>
    <div>ВРАГИ: <span id="enemiesLeft">0</span></div>
    <div>ЭТАП: <span id="stageNum">1</span>/3</div>
  </div>

  <div id="overlay">
    <h1>ЗОМБИ АПОКАЛИПСИС<br>ПРОТИВ БОМЖА ОЛЕГА И КОЛЬЦА 3</h1>
    <p>WASD / Стрелки — бежать | Мышь или Q/E — поворот | ЛКМ / Пробел — стрелять | SHIFT — рывок</p>
    <button id="startBtn" type="button">НАЧАТЬ ИГРУ</button>
    <div id="errorLog" style="color: #ff4444; margin-top: 15px; font-size: 14px;"></div>
  </div>

  <script>
    window.onerror = function(msg, url, line) {
      const log = document.getElementById('errorLog');
      if (log) log.innerText = 'Ошибка: ' + msg + ' (строка ' + line + ')';
    };
  </script>
  <script src="assets.js?v=10"></script>
  <script src="engine.js?v=10"></script>
</body>
</html>
