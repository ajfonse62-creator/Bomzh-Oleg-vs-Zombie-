<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <title>Зомби Апокалипсис 3</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { background: #2b1a1a; color: #0f0; font-family: 'Courier New', monospace; overflow: hidden; user-select: none; }
    .paint-sprite { mix-blend-mode: multiply; filter: contrast(1.2) brightness(1.05); image-rendering: pixelated; pointer-events: none; }
    #viewport {
      position: relative; width: 100vw; height: calc(100vh - 85px);
      background: linear-gradient(180deg, #6e3b3b 0%, #9e5b5b 50%, #9a9aa2 50%, #75757c 100%);
      overflow: hidden;
    }
    canvas { position: absolute; top: 0; left: 0; width: 100%; height: 100%; image-rendering: pixelated; }
    #sprite-layer { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; overflow: hidden; }
    .entity-img { position: absolute; transform: translate(-50%, -50%); transform-origin: center bottom; }
    #player-gun {
      position: absolute; bottom: -15px; left: 50%; width: 260px; height: 260px;
      object-fit: contain; transform: translateX(-50%); transition: transform 0.06s ease-out; z-index: 4;
    }
    #player-gun.recoil { transform: translateX(-50%) translateY(28px) scale(1.06); }
    #mission {
      position: absolute; top: 15px; left: 15px; background: rgba(15, 0, 0, 0.85);
      padding: 12px 18px; border: 3px solid #f00; color: #fff; font-size: 18px;
      max-width: 650px; box-shadow: 0 0 15px #f00; z-index: 10;
    }
    #crosshair {
      position: absolute; top: 45%; left: 50%; transform: translate(-50%, -50%);
      color: #0f0; font-size: 30px; font-weight: bold; pointer-events: none; text-shadow: 0 0 4px #000; z-index: 10;
    }
    #hud {
      position: fixed; bottom: 0; width: 100%; height: 85px;
      background: linear-gradient(180deg, #333, #111); border-top: 4px solid #777;
      display: flex; justify-content: space-around; align-items: center;
      font-size: 24px; font-weight: bold; color: #ff3333; z-index: 10;
    }
    #hud span { color: #fff; }
    #overlay {
      position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0, 0, 0, 0.92);
      display: none; flex-direction: column; justify-content: center; align-items: center;
      color: #fff; text-align: center; z-index: 100; padding: 20px;
    }
    #overlay h1 { color: #f00; font-size: 36px; margin-bottom: 15px; text-shadow: 3px 3px #500; }
    #overlay p { font-size: 18px; margin-bottom: 20px; color: #ccc; }
    button {
      padding: 18px 40px; font-size: 24px; background: #b00; color: #fff;
      border: 4px solid #fff; cursor: pointer; font-family: inherit; font-weight: bold;
    }
    button:hover { background: #f00; }
  </style>
</head>
<body>

  <div id="overlay"></div>

  <div id="viewport">
    <canvas id="c" width="320" height="200"></canvas>
    <div id="sprite-layer"></div>
    <img id="player-gun" class="paint-sprite" src="gun.png" alt="">
    <div id="mission"></div>
    <div id="crosshair">+</div>
  </div>

  <div id="hud">
    <div>HP: <span id="hp">100</span></div>
    <div>ОРДА: <span id="en">0</span></div>
    <div>ЭТАП: <span id="st">1</span>/3</div>
  </div>

  <script>
    const c = document.getElementById('c'), x = c.getContext('2d');
    const spriteLayer = document.getElementById('sprite-layer');
    const gunEl = document.getElementById('player-gun');
    const overlay = document.getElementById('overlay');
    const spSrc = {}, k = {};

    let actx = null;
    function initAudio() {
      if (!actx) actx = new (window.AudioContext || window.webkitAudioContext)();
      if (actx.state === 'suspended') actx.resume();
    }

    function sfx(type) {
      if (!actx || actx.state !== 'running') return;
      const t = actx.currentTime, osc = actx.createOscillator(), g = actx.createGain();
      osc.connect(g); g.connect(actx.destination);
      if (type == 'shoot') {
        osc.type = 'sawtooth'; osc.frequency.setValueAtTime(520, t); osc.frequency.exponentialRampToValueAtTime(90, t + 0.12);
        g.gain.setValueAtTime(0.18, t); g.gain.exponentialRampToValueAtTime(0.01, t + 0.12);
        osc.start(t); osc.stop(t + 0.12);
      } else if (type == 'eshoot') {
        osc.type = 'square'; osc.frequency.setValueAtTime(280, t); osc.frequency.exponentialRampToValueAtTime(70, t + 0.14);
        g.gain.setValueAtTime(0.12, t); g.gain.exponentialRampToValueAtTime(0.01, t + 0.14);
        osc.start(t); osc.stop(t + 0.14);
      } else if (type == 'hit') {
        osc.type = 'square'; osc.frequency.setValueAtTime(160, t); osc.frequency.exponentialRampToValueAtTime(45, t + 0.09);
        g.gain.setValueAtTime(0.2, t); g.gain.exponentialRampToValueAtTime(0.01, t + 0.09);
        osc.start(t); osc.stop(t + 0.09);
      } else if (type == 'hurt') {
        osc.type = 'sawtooth'; osc.frequency.setValueAtTime(120, t); osc.frequency.linearRampToValueAtTime(50, t + 0.2);
        g.gain.setValueAtTime(0.25, t); g.gain.exponentialRampToValueAtTime(0.01, t + 0.2);
        osc.start(t); osc.stop(t + 0.2);
      } else if (type == 'dash') {
        osc.type = 'triangle'; osc.frequency.setValueAtTime(220, t); osc.frequency.exponentialRampToValueAtTime(600, t + 0.15);
        g.gain.setValueAtTime(0.15, t); g.gain.exponentialRampToValueAtTime(0.01, t + 0.15);
        osc.start(t); osc.stop(t + 0.15);
      } else if (type == 'win') {
        osc.type = 'square';
        const notes = new Array(440, 554, 659, 880);
        notes.forEach((f, idx) => osc.frequency.setValueAtTime(f, t + idx * 0.12));
        g.gain.setValueAtTime(0.18, t); g.gain.exponentialRampToValueAtTime(0.01, t + 0.55);
        osc.start(t); osc.stop(t + 0.55);
      }
    }

    function makeFallback(n) {
      const f = document.createElement('canvas'); f.width = f.height = 32; const g = f.getContext('2d');
      g.fillStyle = '#fff'; g.fillRect(0, 0, 32, 32);
      if (n == 'zombie') { g.fillStyle = '#4a2'; g.fillRect(10, 3, 12, 10); g.fillStyle = '#f00'; g.fillRect(12, 6, 2, 2); g.fillRect(18, 6, 2, 2); g.fillStyle = '#246'; g.fillRect(8, 13, 16, 12); g.fillStyle = '#4a2'; g.fillRect(4, 13, 4, 10); g.fillRect(24, 13, 4, 10); g.fillStyle = '#223'; g.fillRect(10, 25, 5, 7); g.fillRect(17, 25, 5, 7); }
      else if (n == 'soldier') { g.fillStyle = '#352'; g.fillRect(9, 2, 14, 5); g.fillStyle = '#dca'; g.fillRect(10, 7, 12, 6); g.fillStyle = '#f00'; g.fillRect(12, 9, 2, 2); g.fillRect(18, 9, 2, 2); g.fillStyle = '#463'; g.fillRect(8, 13, 16, 12); g.fillStyle = '#111'; g.fillRect(6, 16, 20, 3); g.fillStyle = '#231'; g.fillRect(10, 25, 5, 7); g.fillRect(17, 25, 5, 7); }
      else if (n == 'friend') { g.fillStyle = '#642'; g.fillRect(10, 2, 12, 4); g.fillStyle = '#fdb'; g.fillRect(10, 6, 12, 7); g.fillStyle = '#000'; g.fillRect(11, 8, 4, 3); g.fillRect(17, 8, 4, 3); g.fillStyle = '#ddd'; g.fillRect(8, 13, 16, 12); g.fillStyle = '#08f'; g.fillRect(15, 13, 2, 10); g.fillStyle = '#225'; g.fillRect(10, 25, 5, 7); g.fillRect(17, 25, 5, 7); }
      else if (n == 'oleg') { g.fillStyle = '#555'; g.fillRect(9, 2, 14, 5); g.fillStyle = '#dca'; g.fillRect(10, 7, 12, 6); g.fillStyle = '#642'; g.fillRect(10, 10, 12, 5); g.fillStyle = '#753'; g.fillRect(7, 13, 18, 13); g.fillStyle = '#333'; g.fillRect(10, 26, 5, 6); g.fillRect(17, 26, 5, 6); }
      else if (n == 'трассер') { g.fillStyle = '#000'; g.fillRect(12, 2, 8, 28); g.fillStyle = '#f80'; g.fillRect(13, 3, 6, 26); g.fillStyle = '#ff0'; g.fillRect(14, 4, 4, 24); }
      else { g.fillStyle = '#444'; g.fillRect(13, 6, 6, 22); g.fillStyle = '#222'; g.fillRect(14, 4, 4, 4); g.fillStyle = '#742'; g.fillRect(12, 24, 8, 8); }
      return f.toDataURL();
    }

    const spriteList = new Array('oleg', 'zombie', 'friend', 'gun', 'soldier', 'трассер');
    spriteList.forEach(n => {
      spSrc[n] = makeFallback(n);
      const m = new Image();
      m.onload = () => { spSrc[n] = n + '.png'; if (n == 'gun') gunEl.src = spSrc.gun; };
      m.onerror = () => { if (n == 'gun') gunEl.src = spSrc.gun; };
      m.src = n + '.png';
    });

    const W = 60, H = 40, map = Array.from({ length: H }, (_, y) => Array.from({ length: W }, (_, xx) => {
      if (y == 0 || y == H - 1 || xx == 0 || xx == W - 1) return 1;
      if (xx >= 48 && xx <= 57 && y >= 30 && y <= 37) {
        if (y == 30 && (xx == 52 || xx == 53)) return 0;
        if (y == 30) return 3;
        if (y == 37 || xx == 48 || xx == 57) return 6;
        return 0;
      }
      if (xx >= 2 && xx <= 8 && y >= 2 && y <= 8) {
        if (xx == 8 && (y == 4 || y == 5)) return 2;
        if (y == 8 && xx == 5) return 0;
        if (xx == 2 || xx == 8 || y == 2 || y == 8) return 1;
        return 0;
      }
      if (xx % 8 >= 2 && xx % 8 <= 6 && y % 8 >= 2 && y % 8 <= 6) {
        if ((xx + y) % 9 == 0) return 2;
        const cIdx = (Math.floor(xx / 8) + Math.floor(y / 8)) % 3;
        if (cIdx == 0) return 1;
        if (cIdx == 1) return 4;
        return 5;
      }
      return 0;
    }));
    // Старт на широкой центральной улице (x: 15.5, y: 15.5), а не вплотную к стене
    let p = { x: 15.5, y: 15.5, d: 0, hp: 100, sh: 0 }, st = 1, ens = [], bs = [], rc = 0, run = 1, br = 0, hurtCd = 0;

    function spawnCity(n, hp, t, cd = 0) {
      for (let i = 0; i < n; i++) {
        let rx, ry;
        do { rx = 10 + Math.floor(Math.random() * 46); ry = 6 + Math.floor(Math.random() * 30); }
        while (map[ry][rx] != 0 || Math.hypot(rx - p.x, ry - p.y) < 6);
        ens.push({ x: rx + .5, y: ry + .5, hp, t, cd });
      }
    }

    function set(s) {
      st = s; document.getElementById('st').innerText = st; ens = []; bs = [];
      if (s > 1) sfx('win');
      if (s == 1) {
        document.getElementById('mission').innerText = "ЭТАП 1: Огромный город захвачен! Зачисти улицы с Умным Другом! (WASD, Мышь/Q/E, ЛКМ/Пробел, SHIFT)";
        p.x = 15.5; p.y = 15.5; ens.push({ x: 15.5, y: 14.2, hp: 999, t: 'friend' }); spawnCity(24, 70, 'zombie');
      } else if (s == 2) {
        document.getElementById('mission').innerText = "ЭТАП 2: Заражённая армия в городе! Отбей атаку солдат (убежище с окнами на северо-западе)!";
        ens.push({ x: p.x, y: p.y - 1, hp: 999, t: 'friend' }); spawnCity(14, 95, 'soldier', 40);
      } else {
        document.getElementById('mission').innerText = "ЭТАП 3: Исследуй огромный город и САМ НАЙДИ синюю 'ЛАБОРАТОРИЮ НЕЗНАЙКИ'!";
        ens.push({ x: p.x, y: p.y - 1, hp: 999, t: 'friend' }); spawnCity(22, 80, 'zombie'); ens.push({ x: 53, y: 34, hp: 999, t: 'oleg' });
      }
    }

    function fire() {
      if (!run || rc > 0 || br > 0) return;
      rc = 7;
      sfx('shoot');
      gunEl.classList.add('recoil');
      setTimeout(() => gunEl.classList.remove('recoil'), 70);
      bs.push({ x: p.x + Math.cos(p.d) * .5, y: p.y + Math.sin(p.d) * .5, vx: Math.cos(p.d) * .18, vy: Math.sin(p.d) * .18, fp: 1 });
    }

    onkeydown = e => {
      initAudio();
      k[e.code] = 1;
      if (e.code == 'Space') fire();
      if (e.code.includes('Shift') && p.sh <= 0 && run) { p.sh = 12; sfx('dash'); }
    };
    onkeyup = e => k[e.code] = 0;
    c.onmousedown = () => {
      initAudio();
      if (document.pointerLockElement !== c) try { c.requestPointerLock(); } catch (e) {}
      fire();
    };
    onmousemove = e => { if (document.pointerLockElement === c) p.d += e.movementX * .003; };

    function loop() {
      if (!run) return;
      let sp0 = p.sh > 0 ? .19 : .08; if (p.sh > 0) p.sh--; if (rc > 0) rc--; if (hurtCd > 0) hurtCd--;
      if (k.KeyQ || k.ArrowLeft) p.d -= .045; if (k.KeyE || k.ArrowRight) p.d += .045;
      let mx = 0, my = 0;
      if (k.KeyW || k.ArrowUp) { mx += Math.cos(p.d) * sp0; my += Math.sin(p.d) * sp0; }
      if (k.KeyS || k.ArrowDown) { mx -= Math.cos(p.d) * sp0; my -= Math.sin(p.d) * sp0; }
      if (k.KeyA) { mx += Math.sin(p.d) * sp0; my -= Math.cos(p.d) * sp0; }
      if (k.KeyD) { mx -= Math.sin(p.d) * sp0; my += Math.cos(p.d) * sp0; }
      if (map[p.y | 0][(p.x + mx) | 0] == 0) p.x += mx;
      if (map[(p.y + my) | 0][p.x | 0] == 0) p.y += my;

      let cnt = 0;
      ens.forEach(e => {
        if (e.hp <= 0 || e.t == 'oleg') return;
        let d = Math.hypot(p.x - e.x, p.y - e.y);
        if (e.t == 'friend') {
          if (br > 0) { e.x += (52 - e.x) * .05; e.y += (34 - e.y) * .05; return; }
          if (d > 2.2) { let nx = e.x + (p.x - e.x) / d * .065, ny = e.y + (p.y - e.y) / d * .065; if (map[ny | 0][nx | 0] == 0) { e.x = nx; e.y = ny; } }
          let t = ens.find(z => (z.t == 'zombie' || z.t == 'soldier') && z.hp > 0 && Math.hypot(z.x - e.x, z.y - e.y) < 10);
          if (t && Math.random() < .05) { let a = Math.atan2(t.y - e.y, t.x - e.x); bs.push({ x: e.x, y: e.y, vx: Math.cos(a) * .18, vy: Math.sin(a) * .18, fp: 1 }); }
          return;
        }
        cnt++;
        if (d < 18) {
          if (d > (e.t == 'soldier' ? 4.5 : 1.1)) { let nx = e.x + (p.x - e.x) / d * .03, ny = e.y + (p.y - e.y) / d * .03; if (map[ny | 0][nx | 0] == 0) { e.x = nx; e.y = ny; } }
          else if (e.t == 'zombie') { p.hp -= .5; if (hurtCd <= 0) { sfx('hurt'); hurtCd = 25; } }
          if (e.t == 'soldier' && --e.cd <= 0 && d < 13) {
            e.cd = 60; sfx('eshoot');
            let a = Math.atan2(p.y - e.y, p.x - e.x);
            bs.push({ x: e.x, y: e.y, vx: Math.cos(a) * .15, vy: Math.sin(a) * .15, fp: 0 });
          }
        }
      });

      bs.forEach(b => {
        b.x += b.vx; b.y += b.vy;
        let cl = map[b.y | 0] && map[b.y | 0][b.x | 0];
        if (cl == 1 || cl == 3 || cl == 4 || cl == 5 || cl == 6) { b.dead = 1; return; }
        if (b.fp) ens.forEach(e => {
          if ((e.t == 'zombie' || e.t == 'soldier') && e.hp > 0 && Math.hypot(e.x - b.x, e.y - b.y) < .65) {
            e.hp -= 35; b.dead = 1; sfx('hit');
          }
        });
        else if (Math.hypot(p.x - b.x, p.y - b.y) < .55 && p.sh <= 0) {
          p.hp -= 16; b.dead = 1; sfx('hurt');
        }
      });
      bs = bs.filter(b => !b.dead);

      document.getElementById('hp').innerText = Math.max(0, p.hp | 0);
      document.getElementById('en').innerText = cnt;

      if (p.hp <= 0) {
        run = 0; document.exitPointerLock(); sfx('hurt');
        overlay.innerHTML = '<h1>ОРДА ПОБЕДИЛА!</h1><p>Вы пали в бою за город.</p><button onclick="location.reload()">ЗАНОВО</button>';
        overlay.style.display = 'flex'; return;
      }
      if (st == 1 && cnt == 0) set(2);
      if (st == 2 && cnt == 0) set(3);
      if (st == 3 && p.x > 48.5 && p.x < 56.5 && p.y > 30.5 && p.y < 36.5) {
        document.getElementById('mission').innerText = "ВЫ НАШЛИ ЛАБОРАТОРИЮ! Умный Друг варит зелье...";
        if (++br > 110) {
          run = 0; document.exitPointerLock(); sfx('win');
          overlay.innerHTML = '<h1>ВЫ ПРОШЛИ ЭТУ ИГРУ!</h1><p>Вы сами нашли «Лабораторию Незнайки» в огромном городе! Умный Друг сварил зелье и вылечил Бомжа Олега, солдат и всю орду!</p><button onclick="location.reload()">ЗАНОВО</button>';
          overlay.style.display = 'flex'; return;
        }
      }

      x.clearRect(0, 0, 320, 200);

      const zb = [];
      for (let i = 0; i < 80; i++) {
        let ra = p.d - .52 + (i / 80) * 1.04, d = 0, h = 0;
        while (!h && d < 26) { d += .07; let tx = (p.x + Math.cos(ra) * d) | 0, ty = (p.y + Math.sin(ra) * d) | 0; h = (!map[ty] || map[ty][tx] === undefined) ? 1 : map[ty][tx]; }
        d *= Math.cos(ra - p.d); zb[i] = d; let wh = Math.min(280, 200 / d), sh = Math.max(60, 255 - d * 8);
        if (h == 1) { x.fillStyle = `rgb(${sh * .85},${sh * .3},${sh * .25})`; x.fillRect(i * 4, 100 - wh / 2, 4, wh); }
        else if (h == 2) { x.fillStyle = `rgb(${sh * .8},${sh * .4},${sh * .35})`; x.fillRect(i * 4, 100 - wh / 2, 4, wh * .3); x.fillRect(i * 4, 100 + wh * .2, 4, wh * .3); }
        else if (h == 3 || h == 6) { x.fillStyle = h == 3 ? `rgb(0,${sh * .5},${sh})` : `rgb(${sh * .25},${sh * .35},${sh * .95})`; x.fillRect(i * 4, 100 - wh / 2, 4, wh); }
        else if (h == 4) { x.fillStyle = `rgb(${sh * .9},${sh * .8},${sh * .25})`; x.fillRect(i * 4, 100 - wh / 2, 4, wh); }
        else if (h == 5) { x.fillStyle = `rgb(${sh * .6},${sh * .6},${sh * .65})`; x.fillRect(i * 4, 100 - wh / 2, 4, wh); }
      }

      let objs = [];
      ens.forEach(e => {
        if (e.hp > 0) objs.push({ x: e.x, y: e.y, t: e.t, d: Math.hypot(e.x - p.x, e.y - p.y) });
      });
      bs.forEach(b => {
        objs.push({ x: b.x, y: b.y, t: 'трассер', fp: b.fp, d: Math.hypot(b.x - p.x, b.y - p.y) });
      });
      objs.sort((a, b) => b.d - a.d);

      let htmlSprites = '';
      const vw = spriteLayer.clientWidth, vh = spriteLayer.clientHeight;
      objs.forEach(o => {
        let ang = Math.atan2(o.y - p.y, o.x - p.x) - p.d;
        while (ang < -Math.PI) ang += Math.PI * 2; while (ang > Math.PI) ang -= Math.PI * 2;
        if (Math.abs(ang) < .75 && o.d > .2) {
          let normX = (ang / 1.04 + .5), col = Math.floor(normX * 80);
          if (col >= 0 && col < 80 && zb[col] > o.d) {
            let screenX = normX * vw;
            let screenSize = Math.min(vh * 1.2, (vh * 0.9) / o.d);
            if (o.t == 'трассер') {
              let filterStyle = o.fp ? '' : 'filter: hue-rotate(-55deg) saturate(3) contrast(1.2);';
              htmlSprites += ``;
            } else {
              htmlSprites += ``;
            }
          }
        }
      });
      spriteLayer.innerHTML = htmlSprites;

      requestAnimationFrame(loop);
    }

    set(1);
    loop();
  </script>
</body>
</html>
