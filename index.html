<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>Зомби Апокалипсис 3</title>
<style>
  body { margin: 0; background: #111; color: #0f0; font-family: monospace; overflow: hidden; }
  canvas { display: block; width: 100vw; height: calc(100vh - 45px); image-rendering: pixelated; }
  #msg { position: absolute; top: 8px; left: 8px; background: #300; border: 2px solid #f00; color: #fff; padding: 5px 10px; font-size: 14px; }
  #hud { height: 45px; background: #222; border-top: 2px solid #777; display: flex; justify-content: space-around; align-items: center; font-size: 18px; color: #f44; font-weight: bold; }
  #win { display: none; position: fixed; inset: 0; background: #000; color: #fff; flex-direction: column; justify-content: center; align-items: center; text-align: center; z-index: 9; }
</style>
</head>
<body>
<div id="msg">Загрузка...</div>
<canvas id="c" width="320" height="200"></canvas>
<div id="hud"><div>HP: <span id="hp">100</span></div><div>ОРДА: <span id="en">0</span></div><div>ЭТАП: <span id="st">1</span>/3</div></div>
<div id="win"><h1>ВЫ ПРОШЛИ ЭТУ ИГРУ</h1><p>Умный Друг сварил зелье в Лаборатории Незнайки и вылечил Бомжа Олега, солдат и всю орду!</p></div>

<script>
const c = document.getElementById('c'), ctx = c.getContext('2d'), sp = {}, keys = {};
['oleg','zombie','friend','gun','soldier'].forEach((n, i) => {
  const f = document.createElement('canvas'); f.width = f.height = 32;
  f.getContext('2d').fillStyle = ['#f80','#2a2','#0af','#888','#562'][i]; f.getContext('2d').fillRect(8, 4, 16, 28);
  sp[n] = { im: f, ok: 0 }; const m = new Image(); m.onload = () => sp[n] = { im: m, ok: 1 }; m.src = n + '.png';
});

const map = [
  "111111111111111166666661",
  "100001000000000060000061",
  "100002000442440060000061",
  "100002000400040030000031",
  "100001000444440066006661",
  "100000000000000000000001",
  "100005000000000000000001",
  "100005000555550044400001",
  "100005000500050040400001",
  "100005000552550000000001",
  "111111111111111111111111"
].map(r => r.split('').map(Number));

let p = { x: 8.5, y: 5.5, dir: 0, hp: 100, dash: 0 }, st = 1, ens = [], rec = 0, run = 1, brew = 0;

function setSt(s) {
  st = s; document.getElementById('st').innerText = st; ens = [];
  if (st === 1) {
    document.getElementById('msg').innerText = "ЭТАП 1: ОРДА ЗОМБИ! Отбейся с Умным Другом (WASD, Q/E, ЛКМ/Пробел, SHIFT)";
    p.x = 8.5; p.y = 5.5; ens.push({ x: 7.5, y: 5, hp: 999, t: 'friend' });
    [,,,,,,,,].forEach(([x,y]) => ens.push({ x, y, hp: 45, t: 'zombie' }));
  } else if (st === 2) {
    document.getElementById('msg').innerText = "ЭТАП 2: Солдаты заражены! Стреляй через ОКНА здания слева!";
    p.x = 3; p.y = 3; ens.push({ x: 2.2, y: 4, hp: 999, t: 'friend' });
    [[8.5,2.5],[9.5,3.5],[8.5,6],[11.5,5.5]].forEach(([x,y]) => ens.push({ x, y, hp: 60, t: 'soldier' }));
  } else {
    document.getElementById('msg').innerText = "ЭТАП 3: Зайди внутрь синего здания 'ЛАБОРАТОРИЯ НЕЗНАЙКИ' к другу!";
    [,,,,].forEach(([x,y]) => ens.push({ x, y, hp: 50, t: 'zombie' }));
    ens.push({ x: 19, y: 2.2, hp: 999, t: 'oleg' });
  }
}

function shoot() {
  if (!run || rec > 0) return; rec = 9;
  ens.forEach(e => {
    if (e.t === 'friend' || e.t === 'oleg' || e.hp <= 0) return;
    let d = Math.hypot(e.x - p.x, e.y - p.y), a = Math.atan2(e.y - p.y, e.x - p.x) - p.dir;
    while (a < -Math.PI) a += 6.283; while (a > Math.PI) a -= 6.283;
    if (Math.abs(a) < 0.3 && d < 16) e.hp -= 35;
  });
}

onkeydown = e => { keys[e.code] = 1; if (e.code === 'Space') shoot(); if (e.code.includes('Shift') && p.dash <= 0) p.dash = 12; };
onkeyup = e => keys[e.code] = 0;
c.onmousedown = () => { if (c.requestPointerLock && document.pointerLockElement !== c) try { c.requestPointerLock(); } catch(e){} shoot(); };
onmousemove = e => { if (document.pointerLockElement === c) p.dir += e.movementX * 0.003; };

function loop() {
  if (!run) return;
  let spd = p.dash > 0 ? 0.16 : 0.07; if (p.dash > 0) p.dash--; if (rec > 0) rec--;
  if (keys.KeyQ || keys.ArrowLeft) p.dir -= 0.045; if (keys.KeyE || keys.ArrowRight) p.dir += 0.045;
  let mx = 0, my = 0;
  if (keys.KeyW || keys.ArrowUp) { mx += Math.cos(p.dir) * spd; my += Math.sin(p.dir) * spd; }
  if (keys.KeyS || keys.ArrowDown) { mx -= Math.cos(p.dir) * spd; my -= Math.sin(p.dir) * spd; }
  if (keys.KeyA) { mx += Math.sin(p.dir) * spd; my -= Math.cos(p.dir) * spd; }
  if (keys.KeyD) { mx -= Math.sin(p.dir) * spd; my += Math.cos(p.dir) * spd; }
  if (map[Math.floor(p.y)][Math.floor(p.x + mx)] === 0) p.x += mx;
  if (map[Math.floor(p.y + my)][Math.floor(p.x)] === 0) p.y += my;

  let cnt = 0;
  ens.forEach(e => {
    if (e.hp <= 0 || e.t === 'oleg') return;
    let d = Math.hypot(p.x - e.x, p.y - e.y);
    if (e.t === 'friend') {
      if (brew > 0) { e.x += (18.2 - e.x) * 0.05; e.y += (2.2 - e.y) * 0.05; return; }
      if (d > 2) { let nx = e.x + (p.x - e.x) / d * 0.05, ny = e.y + (p.y - e.y) / d * 0.05; if (map[Math.floor(ny)][Math.floor(nx)] === 0) { e.x = nx; e.y = ny; } }
      let t = ens.find(x => (x.t === 'zombie' || x.t === 'soldier') && x.hp > 0 && Math.hypot(x.x - e.x, x.y - e.y) < 8);
      if (t && Math.random() < 0.05) t.hp -= 15;
      return;
    }
    cnt++;
    if (d > 1.2) { let nx = e.x + (p.x - e.x) / d * 0.02, ny = e.y + (p.y - e.y) / d * 0.02; if (map[Math.floor(ny)][Math.floor(nx)] === 0) { e.x = nx; e.y = ny; } }
    else p.hp -= 0.22;
  });

  document.getElementById('hp').innerText = Math.max(0, Math.floor(p.hp));
  document.getElementById('en').innerText = cnt;
  if (p.hp <= 0) { run = 0; location.reload(); }
  if (st === 1 && cnt === 0) setSt(2);
  if (st === 2 && cnt === 0) setSt(3);
  if (st === 3 && p.x > 16.5 && p.x < 22.5 && p.y > 1 && p.y < 4.2) {
    document.getElementById('msg').innerText = "ВЫ В ЛАБОРАТОРИИ! Умный Друг создаёт зелье...";
    if (++brew > 120) { run = 0; document.getElementById('win').style.display = 'flex'; return; }
  }

  ctx.fillStyle = '#1b0812'; ctx.fillRect(0, 0, 320, 100);
  ctx.fillStyle = '#38383d'; ctx.fillRect(0, 100, 320, 100);
  ctx.fillStyle = '#fff'; for (let y = 110; y < 200; y += 22) ctx.fillRect(156, y, 8, 10);

  const zb = [];
  for (let i = 0; i < 80; i++) {
    let ra = p.dir - 0.52 + (i / 80) * 1.04, d = 0, h = 0;
    while (!h && d < 24) { d += 0.06; let tx = Math.floor(p.x + Math.cos(ra) * d), ty = Math.floor(p.y + Math.sin(ra) * d); h = (!map[ty] || map[ty][tx] === undefined) ? 1 : map[ty][tx]; }
    d *= Math.cos(ra - p.dir); zb[i] = d;
    let wh = Math.min(280, 200 / d), sh = Math.max(45, 240 - d * 10);
    if (h === 1) { ctx.fillStyle = `rgb(${sh*0.8},${sh*0.25},${sh*0.2})`; ctx.fillRect(i*4, 100-wh/2, 4, wh); }
    else if (h === 2) { ctx.fillStyle = `rgb(${sh*0.75},${sh*0.35},${sh*0.3})`; ctx.fillRect(i*4, 100-wh/2, 4, wh*0.3); ctx.fillRect(i*4, 100+wh*0.2, 4, wh*0.3); }
    else if (h === 3 || h === 6) { ctx.fillStyle = h===3 ? `rgb(0,${sh*0.45},${sh})` : `rgb(${sh*0.2},${sh*0.3},${sh*0.9})`; ctx.fillRect(i*4, 100-wh/2, 4, wh); if (h===3 && i%10===0) { ctx.fillStyle='#ff0'; ctx.font='8px monospace'; ctx.fillText('ЛАБОРАТОРИЯ НЕЗНАЙКИ', i*4-28, 100); } }
    else if (h === 4) { ctx.fillStyle = `rgb(${sh*0.9},${sh*0.8},${sh*0.4})`; ctx.fillRect(i*4, 100-wh/2, 4, wh); }
    else if (h === 5) { ctx.fillStyle = `rgb(${sh*0.5},${sh*0.55},${sh*0.6})`; ctx.fillRect(i*4, 100-wh/2, 4, wh); }
  }

  ens.sort((a, b) => Math.hypot(b.x - p.x, b.y - p.y) - Math.hypot(a.x - p.x, a.y - p.y)).forEach(e => {
    if (e.hp <= 0) return;
    let d = Math.hypot(e.x - p.x, e.y - p.y), a = Math.atan2(e.y - p.y, e.x - p.x) - p.dir;
    while (a < -Math.PI) a += 6.283; while (a > Math.PI) a -= 6.283;
    if (Math.abs(a) < 0.7 && d > 0.3) {
      let sx = (0.5 * (a / 0.52) + 0.5) * 320, sz = Math.min(200, 200 / d), ri = Math.floor(sx / 4);
      if (ri >= 0 && ri < 80 && zb[ri] > d) {
        ctx.save(); if (sp[e.t].ok) ctx.globalCompositeOperation = 'multiply';
        ctx.drawImage(sp[e.t].im, sx - sz / 2, 105 - sz / 2, sz, sz); ctx.restore();
        if (e.t === 'friend' && brew > 0) { ctx.fillStyle = '#0f0'; ctx.beginPath(); ctx.arc(sx, 105, Math.max(4, 18 / d), 0, 6.28); ctx.fill(); }
      }
    }
  });

  ctx.save(); if (sp.gun.ok) ctx.globalCompositeOperation = 'multiply';
  ctx.drawImage(sp.gun.im, 110, 110 + rec * 2, 100, 100); ctx.restore();
  requestAnimationFrame(loop);
}
setSt(1); loop();
</script>
</body>
</html>
