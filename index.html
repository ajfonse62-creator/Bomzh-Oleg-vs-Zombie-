<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <title>ULTRA-ZOMBIE: Лаборатория Незнайки</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { background: #111; color: #fff; font-family: 'Courier New', monospace; overflow: hidden; user-select: none; }
    canvas#c { display: block; width: 100vw; height: calc(100vh - 75px); image-rendering: pixelated; }
    #minimap {
      position: absolute; top: 15px; right: 15px; width: 150px; height: 100px;
      border: 2px solid #fff; background: rgba(0, 0, 0, 0.8); z-index: 10; image-rendering: pixelated;
    }
    #style-box {
      position: absolute; top: 130px; right: 15px; width: 180px; text-align: right;
      background: rgba(0, 0, 0, 0.75); border-right: 4px solid #ffaa00; padding: 10px; z-index: 10;
    }
    #style-rank { font-size: 28px; font-weight: bold; color: #ffaa00; text-shadow: 2px 2px #000; }
    #style-log { font-size: 13px; color: #0f0; margin-top: 4px; min-height: 36px; }
    #mission {
      position: absolute; top: 15px; left: 15px; background: rgba(20, 0, 0, 0.85);
      padding: 10px 15px; border: 2px solid #f00; font-size: 15px; max-width: calc(100vw - 210px); z-index: 10;
    }
    #crosshair {
      position: absolute; top: calc(50% - 37px); left: 50%; transform: translate(-50%, -50%);
      color: #0f0; font-size: 26px; font-weight: bold; pointer-events: none; text-shadow: 0 0 4px #000; z-index: 10;
    }
    #hud {
      height: 75px; background: #1a1a1a; border-top: 3px solid #555;
      display: flex; justify-content: space-around; align-items: center; font-size: 22px; font-weight: bold;
    }
    .hp-txt { color: #ff3333; }
    .st-txt { color: #00ccff; }
    #overlay {
      position: fixed; inset: 0; background: rgba(0, 0, 0, 0.92); display: none;
      flex-direction: column; justify-content: center; align-items: center; text-align: center; z-index: 100; padding: 20px;
    }
    #overlay h1 { color: #f00; font-size: 38px; margin-bottom: 15px; }
    #overlay p { font-size: 18px; margin-bottom: 20px; color: #ccc; max-width: 600px; }
    button { padding: 15px 35px; font-size: 22px; background: #c00; color: #fff; border: 3px solid #fff; cursor: pointer; font-weight: bold; }
    button:hover { background: #f00; }
  </style>
</head>
<body>

  <div id="overlay"></div>
  <canvas id="c" width="320" height="200"></canvas>
  <canvas id="minimap" width="60" height="40"></canvas>
  <div id="mission"></div>
  <div id="crosshair">+</div>

  <div id="style-box">
    <div id="style-rank">D</div>
    <div id="style-log"></div>
  </div>

  <div id="hud">
    <div class="hp-txt">HP: <span id="hp">100</span></div>
    <div class="st-txt">РЫВОК: <span id="stam">100</span>%</div>
    <div>ВРАГИ: <span id="en">0</span></div>
    <div>ЭТАП: <span id="st">1</span>/3</div>
  </div>

  <script>
    const c = document.getElementById('c'), x = c.getContext('2d');
    const mm = document.getElementById('minimap'), mx2 = mm.getContext('2d');
    const overlay = document.getElementById('overlay');
    const sp = {}, k = {};

    let actx = null;
    function initAudio() {
      if (!actx) actx = new (window.AudioContext || window.webkitAudioContext)();
      if (actx.state === 'suspended') actx.resume();
    }
    function sfx(type) {
      if (!actx || actx.state !== 'running') return;
      const t = actx.currentTime, o = actx.createOscillator(), g = actx.createGain();
      o.connect(g); g.connect(actx.destination);
      if (type == 'shoot') { o.type = 'sawtooth'; o.frequency.setValueAtTime(580, t); o.frequency.exponentialRampToValueAtTime(80, t + 0.11); g.gain.setValueAtTime(0.16, t); g.gain.exponentialRampToValueAtTime(0.01, t + 0.11); o.start(t); o.stop(t + 0.11); }
      else if (type == 'hit') { o.type = 'square'; o.frequency.setValueAtTime(180, t); o.frequency.exponentialRampToValueAtTime(40, t + 0.08); g.gain.setValueAtTime(0.2, t); g.gain.exponentialRampToValueAtTime(0.01, t + 0.08); o.start(t); o.stop(t + 0.08); }
      else if (type == 'dash') { o.type = 'triangle'; o.frequency.setValueAtTime(200, t); o.frequency.exponentialRampToValueAtTime(650, t + 0.14); g.gain.setValueAtTime(0.15, t); g.gain.exponentialRampToValueAtTime(0.01, t + 0.14); o.start(t); o.stop(t + 0.14); }
      else if (type == 'jump') { o.type = 'sine'; o.frequency.setValueAtTime(150, t); o.frequency.exponentialRampToValueAtTime(380, t + 0.12); g.gain.setValueAtTime(0.14, t); g.gain.exponentialRampToValueAtTime(0.01, t + 0.12); o.start(t); o.stop(t + 0.12); }
      else if (type == 'hurt') { o.type = 'sawtooth'; o.frequency.setValueAtTime(110, t); o.frequency.linearRampToValueAtTime(45, t + 0.18); g.gain.setValueAtTime(0.25, t); g.gain.exponentialRampToValueAtTime(0.01, t + 0.18); o.start(t); o.stop(t + 0.18); }
      else if (type == 'win') { o.type = 'square'; const n = new Array(440, 554, 659, 880); n.forEach((f, i) => o.frequency.setValueAtTime(f, t + i * 0.12)); g.gain.setValueAtTime(0.16, t); g.gain.exponentialRampToValueAtTime(0.01, t + 0.55); o.start(t); o.stop(t + 0.55); }
    }
    function cleanWhiteBg(img) {
      const f = document.createElement('canvas');
      f.width = img.width || 64; f.height = img.height || 64;
      const g = f.getContext('2d');
      g.drawImage(img, 0, 0);
      try {
        const id = g.getImageData(0, 0, f.width, f.height), d = id.data;
        for (let i = 0; i < d.length; i += 4) {
          if (d[i] > 235 && d[i + 1] > 235 && d[i + 2] > 235) d[i + 3] = 0;
        }
        g.putImageData(id, 0, 0);
      } catch (e) {}
      return f;
    }

    function makeFallback(n) {
      const f = document.createElement('canvas'); f.width = f.height = 32; const g = f.getContext('2d');
      if (n == 'zombie') { g.fillStyle = '#4a2'; g.fillRect(10, 3, 12, 10); g.fillStyle = '#f00'; g.fillRect(12, 6, 2, 2); g.fillRect(18, 6, 2, 2); g.fillStyle = '#246'; g.fillRect(8, 13, 16, 12); g.fillStyle = '#4a2'; g.fillRect(4, 13, 4, 10); g.fillRect(24, 13, 4, 10); g.fillStyle = '#223'; g.fillRect(10, 25, 5, 7); g.fillRect(17, 25, 5, 7); }
      else if (n == 'solider') { g.fillStyle = '#352'; g.fillRect(9, 2, 14, 5); g.fillStyle = '#dca'; g.fillRect(10, 7, 12, 6); g.fillStyle = '#f00'; g.fillRect(12, 9, 2, 2); g.fillRect(18, 9, 2, 2); g.fillStyle = '#463'; g.fillRect(8, 13, 16, 12); g.fillStyle = '#111'; g.fillRect(6, 16, 20, 3); g.fillStyle = '#231'; g.fillRect(10, 25, 5, 7); g.fillRect(17, 25, 5, 7); }
      else if (n == 'friend') { g.fillStyle = '#642'; g.fillRect(10, 2, 12, 4); g.fillStyle = '#fdb'; g.fillRect(10, 6, 12, 7); g.fillStyle = '#000'; g.fillRect(11, 8, 4, 3); g.fillRect(17, 8, 4, 3); g.fillStyle = '#fff'; g.fillRect(8, 13, 16, 12); g.fillStyle = '#08f'; g.fillRect(15, 13, 2, 10); g.fillStyle = '#225'; g.fillRect(10, 25, 5, 7); g.fillRect(17, 25, 5, 7); }
      else if (n == 'oleg') { g.fillStyle = '#555'; g.fillRect(9, 2, 14, 5); g.fillStyle = '#dca'; g.fillRect(10, 7, 12, 6); g.fillStyle = '#642'; g.fillRect(10, 10, 12, 5); g.fillStyle = '#753'; g.fillRect(7, 13, 18, 13); g.fillStyle = '#333'; g.fillRect(10, 26, 5, 6); g.fillRect(17, 26, 5, 6); }
      else if (n == 'трассер') { g.fillStyle = '#f80'; g.fillRect(6, 12, 20, 8); g.fillStyle = '#ff0'; g.fillRect(8, 14, 16, 4); }
      else { g.fillStyle = '#444'; g.fillRect(13, 6, 6, 22); g.fillStyle = '#222'; g.fillRect(14, 4, 4, 4); g.fillStyle = '#742'; g.fillRect(12, 24, 8, 8); }
      return f;
    }

    const files = new Array('oleg', 'zombie', 'friend', 'gun', 'solider', 'трассер');
    files.forEach(n => {
      sp[n] = makeFallback(n);
      const m = new Image();
      m.onload = () => { sp[n] = cleanWhiteBg(m); };
      m.src = n + '.png';
    });

    const W = 60, H = 40, map = Array.from({ length: H }, (_, y) => Array.from({ length: W }, (_, xx) => {
      if (y == 0 || y == H - 1 || xx == 0 || xx == W - 1) return 1;
      if (xx >= 48 && xx <= 57 && y >= 30 && y <= 37) {
        if (y == 30 && (xx == 52 || xx == 53)) return 0;
        if (y == 30) return 3;
        if (y == 37 || xx == 48 || xx == 57) return 6;
        return 0;
      }
      if (xx >= 2 && xx <= 8 && y >= 2 && y <= 8) {
        if (xx == 8 && (y == 4 || y == 5)) return 2;
        if (y == 8 && xx == 5) return 0;
        if (xx == 2 || xx == 8 || y == 2 || y == 8) return 1;
        return 0;
      }
      if (xx % 8 >= 2 && xx % 8 <= 6 && y % 8 >= 2 && y % 8 <= 6) {
        if ((xx + y) % 9 == 0) return 2;
        const cIdx = (Math.floor(xx / 8) + Math.floor(y / 8)) % 3;
        return cIdx == 0 ? 1 : (cIdx == 1 ? 4 : 5);
      }
      return 0;
    }));

    let p = { x: 15.5, y: 15.5, d: 0, hp: 100, sh: 0, stam: 100, z: 0, vz: 0 };
    let st = 1, ens = [], bs = [], rc = 0, run = 1, br = 0, hurtCd = 0, hurtFlash = 0;
    let stylePts = 0, styleLog = '';

    function addStyle(pts, label) {
      stylePts = Math.min(700, stylePts + pts);
      styleLog = label + '<br>' + styleLog.split('<br>').slice(0, 2).join('<br>');
      document.getElementById('style-log').innerHTML = styleLog;
    }

    function spawnCity(n, hp, t, cd = 0) {
      for (let i = 0; i < n; i++) {
        let rx, ry;
        do { rx = 8 + Math.floor(Math.random() * 48); ry = 5 + Math.floor(Math.random() * 32); }
        while (map[ry][rx] != 0 || Math.hypot(rx - p.x, ry - p.y) < 7);
        ens.push({ x: rx + .5, y: ry + .5, hp, t, cd });
      }
    }

    function set(s) {
      st = s; document.getElementById('st').innerText = st; ens = []; bs = [];
      if (s > 1) sfx('win');
      if (s == 1) {
        document.getElementById('mission').innerText = "ЭТАП 1: Зачисти город! (WASD — ход, SPACE — прыжок, SHIFT — рывок, ЛКМ/F — огонь)";
        p.x = 15.5; p.y = 15.5; p.d = 0;
        ens.push({ x: 15.5, y: 14.3, hp: 999, t: 'friend' });
        ens.push({ x: 22.5, y: 15.5, hp: 70, t: 'zombie', cd: 0 });
        ens.push({ x: 24.5, y: 14.8, hp: 70, t: 'zombie', cd: 0 });
        ens.push({ x: 26.5, y: 16.0, hp: 70, t: 'zombie', cd: 0 });
        ens.push({ x: 29.5, y: 15.5, hp: 95, t: 'solider', cd: 45 });
        spawnCity(16, 70, 'zombie');
      } else if (s == 2) {
        document.getElementById('mission').innerText = "ЭТАП 2: Вторжение заражённых солдат! Уничтожь отряд!";
        ens.push({ x: p.x, y: p.y - 1, hp: 999, t: 'friend' });
        spawnCity(14, 95, 'solider', 40);
      } else {
        document.getElementById('mission').innerText = "ЭТАП 3: Найди синюю 'ЛАБОРАТОРИЮ НЕЗНАЙКИ' (синий квадрат на радаре)!";
        ens.push({ x: p.x, y: p.y - 1, hp: 999, t: 'friend' });
        spawnCity(20, 80, 'zombie');
        ens.push({ x: 53, y: 34, hp: 999, t: 'oleg' });
      }
    }
    function fire() {
      if (!run || rc > 0 || br > 0) return;
      rc = 7; sfx('shoot');
      bs.push({
        x: p.x + Math.cos(p.d) * .5, y: p.y + Math.sin(p.d) * .5,
        vx: Math.cos(p.d) * .22, vy: Math.sin(p.d) * .22,
        fp: 1, air: p.z > 5, dash: p.sh > 0
      });
    }

    onkeydown = e => {
      initAudio(); k[e.code] = 1;
      if (e.code == 'KeyF') fire();
      if (e.code == 'Space' && p.z == 0 && run) { p.vz = 5.5; sfx('jump'); }
      if (e.code.includes('Shift') && p.sh <= 0 && p.stam >= 33 && run) {
        p.sh = 11; p.stam -= 33; sfx('dash');
      }
    };
    onkeyup = e => k[e.code] = 0;
    c.onmousedown = () => {
      initAudio();
      if (document.pointerLockElement !== c) try { c.requestPointerLock(); } catch (e) {}
      fire();
    };
    onmousemove = e => { if (document.pointerLockElement === c) p.d += e.movementX * .0035; };

    function loop() {
      if (!run) return;
      if (p.stam < 100) p.stam = Math.min(100, p.stam + 0.4);
      if (p.sh > 0) p.sh--; if (rc > 0) rc--; if (hurtCd > 0) hurtCd--; if (hurtFlash > 0) hurtFlash--;
      if (stylePts > 0) stylePts = Math.max(0, stylePts - 0.15);

      if (p.z > 0 || p.vz != 0) {
        p.z += p.vz; p.vz -= 0.45;
        if (p.z <= 0) { p.z = 0; p.vz = 0; }
      }

      let sp0 = p.sh > 0 ? .22 : .085;
      if (k.KeyQ || k.ArrowLeft) p.d -= .045;
      if (k.KeyE || k.ArrowRight) p.d += .045;
      let mx = 0, my = 0;
      if (k.KeyW || k.ArrowUp) { mx += Math.cos(p.d) * sp0; my += Math.sin(p.d) * sp0; }
      if (k.KeyS || k.ArrowDown) { mx -= Math.cos(p.d) * sp0; my -= Math.sin(p.d) * sp0; }
      if (k.KeyA) { mx += Math.sin(p.d) * sp0; my -= Math.cos(p.d) * sp0; }
      if (k.KeyD) { mx -= Math.sin(p.d) * sp0; my += Math.cos(p.d) * sp0; }
      if (map[p.y | 0][(p.x + mx) | 0] == 0) p.x += mx;
      if (map[(p.y + my) | 0][p.x | 0] == 0) p.y += my;

      let cnt = 0;
      ens.forEach(e => {
        if (e.hp <= 0 || e.t == 'oleg') return;
        let d = Math.hypot(p.x - e.x, p.y - e.y);
        if (e.t == 'friend') {
          if (br > 0) { e.x += (52 - e.x) * .05; e.y += (34 - e.y) * .05; return; }
          if (d > 2.2) {
            let vx = (p.x - e.x) / d * .07, vy = (p.y - e.y) / d * .07;
            if (map[e.y | 0][(e.x + vx) | 0] == 0) e.x += vx;
            if (map[(e.y + vy) | 0][e.x | 0] == 0) e.y += vy;
          }
          let t = ens.find(z => (z.t == 'zombie' || z.t == 'solider') && z.hp > 0 && Math.hypot(z.x - e.x, z.y - e.y) < 10);
          if (t && Math.random() < .04) {
            let a = Math.atan2(t.y - e.y, t.x - e.x);
            bs.push({ x: e.x, y: e.y, vx: Math.cos(a) * .2, vy: Math.sin(a) * .2, fp: 1 });
          }
          return;
        }
        cnt++;
        if (d < 22) {
          let stopDist = e.t == 'solider' ? 4.5 : 1.5;
          if (d > stopDist) {
            let vx = (p.x - e.x) / d * .038, vy = (p.y - e.y) / d * .038;
            if (map[e.y | 0][(e.x + vx) | 0] == 0) e.x += vx;
            if (map[(e.y + vy) | 0][e.x | 0] == 0) e.y += vy;
          } else if (e.t == 'zombie' && p.z < 12) {
            p.hp -= .45; hurtFlash = 6;
            if (hurtCd <= 0) { sfx('hurt'); hurtCd = 25; }
          }
          if (e.t == 'solider' && --e.cd <= 0 && d < 13) {
            e.cd = 60;
            let a = Math.atan2(p.y - e.y, p.x - e.x);
            bs.push({ x: e.x, y: e.y, vx: Math.cos(a) * .16, vy: Math.sin(a) * .16, fp: 0 });
          }
        }
      });

      bs.forEach(b => {
        b.x += b.vx; b.y += b.vy;
        let cl = map[b.y | 0] && map[b.y | 0][b.x | 0];
        if (cl == 1 || cl == 3 || cl == 4 || cl == 5 || cl == 6) { b.dead = 1; return; }
        if (b.fp) ens.forEach(e => {
          if ((e.t == 'zombie' || e.t == 'solider') && e.hp > 0 && Math.hypot(e.x - b.x, e.y - b.y) < .75) {
            e.hp -= 35; b.dead = 1; sfx('hit');
            if (e.hp <= 0) {
              if (b.air) addStyle(120, '+ AIRSHOT');
              else if (b.dash) addStyle(100, '+ DASH KILL');
              else addStyle(60, '+ KILL');
              if (Math.hypot(p.x - e.x, p.y - e.y) < 3.5) {
                p.hp = Math.min(100, p.hp + 15);
                addStyle(50, '+ BLOOD HEAL');
              }
            }
          }
        });
        else if (Math.hypot(p.x - b.x, p.y - b.y) < .6 && p.sh <= 0 && p.z < 10) {
          p.hp -= 15; b.dead = 1; hurtFlash = 8; sfx('hurt');
        }
      });
      bs = bs.filter(b => !b.dead);

      document.getElementById('hp').innerText = Math.max(0, p.hp | 0);
      document.getElementById('stam').innerText = Math.floor(p.stam);
      document.getElementById('en').innerText = cnt;
      const ranks = new Array('D', 'C', 'B', 'A', 'S', 'SS', 'SSS', 'ULTRAKILL');
      document.getElementById('style-rank').innerText = ranks[Math.min(7, Math.floor(stylePts / 85))];

      if (p.hp <= 0) {
        run = 0; document.exitPointerLock(); sfx('hurt');
        overlay.innerHTML = '<h1>ВЫ ПОГИБЛИ</h1><p>Орда оказалась сильнее.</p><button onclick="location.reload()">ЗАНОВО</button>';
        overlay.style.display = 'flex'; return;
      }
      if (st == 1 && cnt == 0) set(2);
      if (st == 2 && cnt == 0) set(3);
      if (st == 3 && p.x > 48.5 && p.x < 56.5 && p.y > 30.5 && p.y < 36.5) {
        document.getElementById('mission').innerText = "ВЫ В ЛАБОРАТОРИИ! Умный Друг варит зелье...";
        if (++br > 110) {
          run = 0; document.exitPointerLock(); sfx('win');
          overlay.innerHTML = '<h1>ПОБЕДА!</h1><p>Вы нашли «Лабораторию Незнайки»! Умный Друг сварил зелье и спас Бомжа Олега и весь город!</p><button onclick="location.reload()">ЗАНОВО</button>';
          overlay.style.display = 'flex'; return;
        }
      }

      const horizon = 100 + p.z;
      x.fillStyle = '#3b1c1c'; x.fillRect(0, 0, 320, horizon);
      x.fillStyle = '#484850'; x.fillRect(0, horizon, 320, 200 - horizon);

      const zb = [];
      for (let i = 0; i < 80; i++) {
        let ra = p.d - .52 + (i / 80) * 1.04, d = 0, h = 0;
        while (!h && d < 26) { d += .07; let tx = (p.x + Math.cos(ra) * d) | 0, ty = (p.y + Math.sin(ra) * d) | 0; h = (!map[ty] || map[ty][tx] === undefined) ? 1 : map[ty][tx]; }
        d *= Math.cos(ra - p.d); zb[i] = d; let wh = Math.min(280, 200 / d), sh = Math.max(50, 250 - d * 8);
        let yTop = horizon - wh / 2 + (p.z / d);
        if (h == 1) { x.fillStyle = `rgb(${sh * .85},${sh * .25},${sh * .2})`; x.fillRect(i * 4, yTop, 4, wh); }
        else if (h == 2) { x.fillStyle = `rgb(${sh * .8},${sh * .35},${sh * .3})`; x.fillRect(i * 4, yTop, 4, wh * .3); x.fillRect(i * 4, yTop + wh * .7, 4, wh * .3); }
        else if (h == 3 || h == 6) { x.fillStyle = h == 3 ? `rgb(0,${sh * .5},${sh})` : `rgb(${sh * .2},${sh * .35},${sh * .95})`; x.fillRect(i * 4, yTop, 4, wh); }
        else if (h == 4) { x.fillStyle = `rgb(${sh * .9},${sh * .8},${sh * .2})`; x.fillRect(i * 4, yTop, 4, wh); }
        else if (h == 5) { x.fillStyle = `rgb(${sh * .55},${sh * .55},${sh * .6})`; x.fillRect(i * 4, yTop, 4, wh); }
      }

      let objs = [];
      ens.forEach(e => { if (e.hp > 0) objs.push({ x: e.x, y: e.y, t: e.t, d: Math.hypot(e.x - p.x, e.y - p.y) }); });
      bs.forEach(b => { objs.push({ x: b.x, y: b.y, t: 'трассер', d: Math.hypot(b.x - p.x, b.y - p.y) }); });
      objs.sort((a, b) => b.d - a.d);

      objs.forEach(o => {
        let ang = Math.atan2(o.y - p.y, o.x - p.x) - p.d;
        while (ang < -Math.PI) ang += Math.PI * 2; while (ang > Math.PI) ang -= Math.PI * 2;
        if (Math.abs(ang) < .85 && o.d > .1) {
          let sx = (ang / 1.04 + .5) * 320, col = Math.floor(sx / 4);
          if (col >= 0 && col < 80 && zb[col] > o.d) {
            let sz = Math.min(220, 175 / o.d);
            let yCenter = horizon + (p.z / o.d);
            if (o.t == 'трассер') {
              x.drawImage(sp['трассер'], sx - sz * .3, yCenter - sz * .3, sz * .6, sz * .6);
            } else {
              x.drawImage(sp[o.t], sx - sz / 2, yCenter - sz / 2, sz, sz);
            }
          }
        }
      });

      x.drawImage(sp.gun, 130, 118 + rc * 2.5, 85, 85);

      if (hurtFlash > 0) {
        x.fillStyle = `rgba(255, 0, 0, ${hurtFlash * 0.05})`;
        x.fillRect(0, 0, 320, 200);
      }

      mx2.fillStyle = '#111'; mx2.fillRect(0, 0, W, H);
      for (let yy = 0; yy < H; yy++) {
        for (let xx = 0; xx < W; xx++) {
          let cell = map[yy][xx];
          if (cell == 3 || cell == 6) { mx2.fillStyle = '#08f'; mx2.fillRect(xx, yy, 1, 1); }
          else if (cell != 0) { mx2.fillStyle = '#555'; mx2.fillRect(xx, yy, 1, 1); }
        }
      }
      ens.forEach(e => {
        if (e.hp <= 0) return;
        mx2.fillStyle = e.t == 'friend' ? '#0af' : (e.t == 'oleg' ? '#ff0' : '#f00');
        mx2.fillRect((e.x | 0), (e.y | 0), 1.5, 1.5);
      });
      mx2.fillStyle = '#0f0'; mx2.fillRect((p.x | 0), (p.y | 0), 2, 2);

      requestAnimationFrame(loop);
    }

    set(1);
    loop();
  </script>
</body>
</html>
